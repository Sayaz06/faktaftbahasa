<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Istigfar Kindle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      margin: 8px 0 12px;
      letter-spacing: 0.04em;
    }
    .sub {
      text-align: center;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 12px;
      margin: 10px 0;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      border-radius: 6px;
    }
    .btn:active { background: #000; color: #fff; }
    .btn-primary { background: #000; color: #fff; }
    .btn-primary:active { background: #333; }
    .btn-sm {
      padding: 10px 8px;
      font-size: 0.95rem;
      width: auto;
      display: inline-block;
      margin: 4px;
    }

    .counter-box {
      border: 3px solid #000;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      margin: 14px 0;
      min-height: 140px;
    }
    .mode-label {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .phase {
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .big-text {
      font-size: 1.6rem;
      line-height: 1.35;
      font-weight: bold;
      word-break: break-word;
      margin: 10px 0;
    }
    .progress {
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .meta {
      font-size: 0.8rem;
      color: #444;
      margin-top: 6px;
    }

    .status-bar {
      border: 1px solid #000;
      padding: 8px;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 12px;
      background: #f5f5f5;
    }
    .row {
      text-align: center;
      margin: 8px 0;
    }

    #login-msg, #err-msg {
      text-align: center;
      font-size: 0.9rem;
      margin: 12px 0;
      min-height: 1.2em;
    }
    .error { color: #800; font-weight: bold; }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="screen-login" class="screen active">
    <h1>Istigfar Kindle</h1>
    <div class="sub">Countdown Bahasa & Fakta<br>Sync dengan phone</div>
    <button id="btn-login" class="btn btn-primary">Login Google</button>
    <div id="login-msg"></div>
    <div class="footer">Kindle Edition · Ringan · E-ink</div>
  </div>

  <div id="screen-main" class="screen">
    <div class="status-bar" id="status-bar">Menyambung...</div>

    <div class="counter-box">
      <div class="mode-label" id="mode-label">—</div>
      <div class="phase" id="phase-label">—</div>
      <div class="big-text" id="main-text">Belum ada sesi aktif</div>
      <div class="progress" id="progress-label"></div>
      <div class="meta" id="meta-label"></div>
    </div>

    <button id="btn-next" class="btn btn-primary">SETERUSNYA →</button>

    <div class="row">
      <button id="btn-mode-bahasa" class="btn btn-sm">Bahasa</button>
      <button id="btn-mode-fakta" class="btn btn-sm">Fakta</button>
    </div>

    <div class="row">
      <button id="btn-enter-sr" class="btn btn-sm">Masuk SR</button>
      <button id="btn-refresh" class="btn btn-sm">Refresh</button>
      <button id="btn-logout" class="btn btn-sm">Logout</button>
    </div>

    <div id="err-msg" class="error"></div>
    <div class="footer">Tap SETERUSNYA = next laci / tick ikut phone</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAGLX_xxH_dQ06epX4XCXtuSHN0DwZFMjA",
      authDomain: "stress-auti-action.firebaseapp.com",
      projectId: "stress-auti-action",
      storageBucket: "stress-auti-action.firebasestorage.app",
      messagingSenderId: "792580618622",
      appId: "1:792580618622:web:f0efb1d630e795584d5b2f",
      measurementId: "G-JH11TRZLGF"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.firestore();

    var currentUser = null;
    var unsubSession = null;
    var sessionData = null;

    function showScreen(id) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) {
        screens[i].className = 'screen';
      }
      var el = document.getElementById(id);
      if (el) el.className = 'screen active';
    }

    function setText(id, txt) {
      var el = document.getElementById(id);
      if (el) el.textContent = txt || '';
    }

    function showErr(msg) {
      setText('err-msg', msg || '');
    }

    function renderSession(data) {
      sessionData = data || null;
      if (!data) {
        setText('status-bar', 'Tiada sesi aktif — buka countdown di phone');
        setText('mode-label', '—');
        setText('phase-label', '—');
        setText('main-text', 'Belum ada sesi aktif');
        setText('progress-label', '');
        setText('meta-label', '');
        return;
      }

      var mode = data.mode || '—';
      var isSR = !!data.isSR;
      var phase = data.phase || '';
      var text = data.text || data.title || '(kosong)';
      var progress = data.progress || '';
      var meta = data.meta || '';

      setText('status-bar', 'Sync OK · ' + (data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : ''));
      setText('mode-label', (isSR ? 'SR · ' : '') + (mode === 'bahasa' ? 'LACI BAHASA' : mode === 'fakta' ? 'LACI FAKTA' : String(mode).toUpperCase()));
      setText('phase-label', phase);
      setText('main-text', text);
      setText('progress-label', progress);
      setText('meta-label', meta);
    }

    function startSessionListener(uid) {
      if (unsubSession) unsubSession();
      unsubSession = db.collection('users').doc(uid).collection('kindle_session').doc('current')
        .onSnapshot(function(snap) {
          if (snap.exists) {
            renderSession(snap.data());
          } else {
            renderSession(null);
          }
        }, function(err) {
          setText('status-bar', 'Error sync: ' + err.message);
          showErr(err.message);
        });
    }

    function sendCommand(cmd, extra) {
      if (!currentUser) return;
      var payload = {
        command: cmd,
        ts: Date.now(),
        from: 'kindle'
      };
      if (extra) {
        for (var k in extra) {
          if (Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k];
        }
      }
      db.collection('users').doc(currentUser.uid).collection('kindle_session').doc('command')
        .set(payload)
        .then(function() {
          showErr('');
          setText('status-bar', 'Command dihantar: ' + cmd);
        })
        .catch(function(e) {
          showErr('Gagal hantar: ' + e.message);
        });
    }

    document.getElementById('btn-login').onclick = function() {
      setText('login-msg', 'Membuka Google...');
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(function(e) {
        auth.signInWithRedirect(provider).catch(function(e2) {
          setText('login-msg', 'Login gagal: ' + (e2.message || e.message));
        });
      });
    };

    document.getElementById('btn-logout').onclick = function() {
      if (unsubSession) unsubSession();
      auth.signOut();
    };

    document.getElementById('btn-next').onclick = function() {
      sendCommand('next');
    };

    document.getElementById('btn-enter-sr').onclick = function() {
      sendCommand('enterSR');
    };

    document.getElementById('btn-mode-bahasa').onclick = function() {
      sendCommand('switchMode', { mode: 'bahasa' });
    };

    document.getElementById('btn-mode-fakta').onclick = function() {
      sendCommand('switchMode', { mode: 'fakta' });
    };

    document.getElementById('btn-refresh').onclick = function() {
      if (currentUser) startSessionListener(currentUser.uid);
      setText('status-bar', 'Refresh...');
    };

    auth.onAuthStateChanged(function(user) {
      currentUser = user;
      if (user) {
        showScreen('screen-main');
        setText('status-bar', 'Logged in: ' + (user.email || user.uid));
        startSessionListener(user.uid);
      } else {
        showScreen('screen-login');
        setText('login-msg', '');
      }
    });

    auth.getRedirectResult().catch(function() {});
  </script>
</body>
</html>
