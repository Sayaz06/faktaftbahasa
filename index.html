<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Istigfar Kindle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #fff; color: #000; font-family: Georgia, "Times New Roman", serif; -webkit-text-size-adjust: 100%; }
    body { padding: 4px 6px; max-width: 420px; margin: 0 auto; }
    .screen { display: none; } .screen.active { display: block; }
    h1 { font-size: 1.15rem; text-align: center; margin: 4px 0 6px; }
    .sub { text-align: center; font-size: 0.78rem; color: #333; margin-bottom: 8px; }
    .btn { display: block; width: 100%; padding: 11px 8px; margin: 4px 0; font-size: 1.05rem; font-weight: bold; text-align: center; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; border-radius: 6px; }
    .btn:active { background: #000; color: #fff; }
    .btn-primary { background: #000; color: #fff; }
    .btn-primary:active { background: #333; }
    .btn-row { display: table; width: 100%; border-collapse: separate; border-spacing: 4px 0; margin: 3px 0 0; }
    .btn-row .btn-sm { display: table-cell; width: 25%; padding: 16px 2px; font-size: 0.8rem; font-weight: bold; text-align: center; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; border-radius: 6px; vertical-align: middle; }
    .btn-row .btn-sm.on { background: #000; color: #fff; }
    .btn-row .btn-sm:active { background: #000; color: #fff; }
    .btn-row .btn-menu { background: #ddd; color: #000; }
    .pin-input { width: 100%; padding: 12px; font-size: 1.4rem; text-align: center; letter-spacing: 0.3em; border: 2px solid #000; border-radius: 8px; background: #fff; color: #000; outline: none; margin: 8px 0; font-family: monospace; }
    .status-bar { border: 1px solid #000; padding: 3px 6px; font-size: 0.68rem; text-align: center; margin-bottom: 3px; background: #f5f5f5; }
    .counter-box { border: 3px solid #000; border-radius: 10px; padding: 6px 8px; text-align: center; margin: 3px 0; }
    .mode-label { font-size: 0.65rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1px; }
    .side-label { font-size: 0.65rem; font-weight: bold; margin-bottom: 1px; }
    .big-text { font-size: 1.25rem; line-height: 1.3; font-weight: bold; word-break: break-word; margin: 3px 0; white-space: pre-wrap; text-align: center; }
    .big-text.tips-mode { font-size: 0.92rem; line-height: 1.4; font-weight: normal; text-align: left; }
    .big-text.long-text { font-size: 1.05rem; line-height: 1.3; }
    .card-img { display: block; max-width: 100%; margin: 2px auto; border: 1px solid #000; }
    .progress { font-size: 0.72rem; margin-top: 1px; }
    .meta { font-size: 0.65rem; color: #444; margin-top: 1px; }
    .msg { text-align: center; font-size: 0.75rem; margin: 2px 0; min-height: 0.9em; }
    .error { color: #800; font-weight: bold; }
    .footer { text-align: center; font-size: 0.65rem; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="screen-login" class="screen active">
    <h1>Istigfar Kindle</h1>
    <div class="sub">Linked dengan phone · PIN</div>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button id="btn-login" class="btn btn-primary">Masuk</button>
    <div id="login-msg" class="msg"></div>
  </div>
  <div id="screen-menu" class="screen">
    <h1>Istigfar Kindle</h1>
    <div class="sub" id="menu-user">—</div>
    <button id="btn-go-bahasa" class="btn btn-primary">Laci Bahasa</button>
    <button id="btn-go-fakta" class="btn">Laci Fakta</button>
    <button id="btn-logout" class="btn" style="margin-top:12px;font-size:0.9rem;padding:10px;">Logout</button>
    <div class="footer">SR auto-check · progress sync phone</div>
  </div>
  <div id="screen-play" class="screen">
    <div class="status-bar" id="play-status">—</div>
    <div class="counter-box" id="counter-box">
      <div class="mode-label" id="play-mode">—</div>
      <div class="side-label" id="side-label">MUKA DEPAN</div>
      <img id="card-img" class="card-img" alt="" style="display:none;">
      <div class="big-text" id="main-text">—</div>
      <div class="progress" id="play-progress"></div>
      <div class="meta" id="play-meta"></div>
    </div>
    <button id="btn-next" class="btn btn-primary">SETERUSNYA</button>
    <div class="btn-row">
      <button id="btn-back-menu" class="btn-sm btn-menu">Menu</button>
      <button id="btn-flip" class="btn-sm">Flip</button>
      <button id="btn-tips" class="btn-sm">Tips</button>
      <button id="btn-reload" class="btn-sm">Reload</button>
    </div>
    <div class="btn-row" style="margin-top:4px;">
      <button id="btn-jq" class="btn-sm" style="width:100%;font-size:0.75rem;">JQ: OFF</button>
    </div>
    <div id="play-err" class="msg error"></div>
  </div>
  <div id="flip-block-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;">
    <div style="margin:20px auto 0;background:#fff;border:2px solid #000;border-radius:8px;padding:12px 14px;max-width:300px;width:90%;text-align:center;">
      <div style="font-weight:bold;font-size:0.95rem;margin-bottom:8px;">Flip tidak dibenarkan</div>
      <div style="font-size:0.82rem;line-height:1.4;margin-bottom:10px;">Fasa Hafal Gambar fokus pada imej sahaja. Tutup mata, bayangkan gambar, kemudian tekan SETERUSNYA.</div>
      <button id="flip-block-ok" class="btn btn-primary" style="margin-top:3px;padding:8px;">Faham</button>
    </div>
  </div>
  <div id="jq-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;">
    <div style="margin:20px auto 0;background:#fff;border:2px solid #000;border-radius:8px;padding:10px 12px;max-width:300px;width:90%;text-align:center;">
      <div style="font-weight:bold;font-size:0.85rem;margin-bottom:6px;">Masukkan PIN untuk ON JQ</div>
      <input id="jq-pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off" style="padding:7px;font-size:1.1rem;margin:4px 0;">
      <button id="jq-pin-ok" class="btn btn-primary" style="margin-top:3px;padding:8px;">Sahkan</button>
      <button id="jq-pin-batal" class="btn" style="margin-top:3px;padding:8px;">Batal</button>
      <div id="jq-pin-msg" class="msg error"></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
