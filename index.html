    function loadQuranProgress() {
      if (!currentUser) return Promise.resolve();
      // Guna get() tanpa orderBy — sort dalam JS untuk elak perlukan Firestore index
      return db.collection('users').doc(currentUser.uid)
        .collection('quran_progress_log')
        .get()
        .then(function(snap) {
          if (snap.empty) {
            quranSurahSemasa = 1;
            quranAyatSemasa = 0;
            return;
          }
          // Sort ikut savedAt descending dalam JS
          var docs = [];
          snap.forEach(function(d) { var x = d.data(); docs.push(x); });
          docs.sort(function(a, b) { return (b.savedAt || 0) - (a.savedAt || 0); });
          var terkini = docs[0];
          quranSurahSemasa = terkini.surah || 1;
          quranAyatSemasa = terkini.ayat || 0;
        })
        .catch(function() {
          quranSurahSemasa = 1;
          quranAyatSemasa = 0;
        });
    }

    function simpanProgressQuran(surah, ayat, isNextSurah) {
      if (!currentUser) return Promise.resolve();
      var data = {
        surah: surah,
        ayat: ayat,
        savedAt: Date.now()
      };
      if (isNextSurah) data.isNextSurah = true;
      return db.collection('users').doc(currentUser.uid)
        .collection('quran_progress_log')
        .add(data)
        .then(function() {
          quranSurahSemasa = surah;
          quranAyatSemasa = ayat;
        })
        .catch(function() {});
    }

    function getSRInterval(fasaIndex) {
      if (fasaIndex < SR_INTERVALS.length) return SR_INTERVALS[fasaIndex];
      return (8 + (fasaIndex - SR_INTERVALS.length)) * 24 * 60 * 60 * 1000;
    }
    function getLabelFasaSR(fasaIndex) {
      var labels = [
        'Fasa 1 — +20 minit', 'Fasa 2 — +2 jam', 'Fasa 3 — +4 jam', 'Fasa 4 — +6 jam',
        'Fasa 5 — +2 hari', 'Fasa 6 — +4 hari', 'Fasa 7 — +6 hari', 'Fasa 8 — +7 hari'
      ];
      if (fasaIndex < labels.length) return labels[fasaIndex];
      return 'Fasa ' + (fasaIndex + 1) + ' — +' + (8 + (fasaIndex - 8)) + ' hari';
    }

    /** Auto-saiz gambar: ambil saki-baki skrin, kecilkan bila ayat panjang */
    function autoFitImage(textLen) {
      var img = document.getElementById('card-img');
      if (!img || img.style.display === 'none') return;

      var vh = window.innerHeight || 600;
      // Rizab: status(~28) + labels(~36) + progress/meta(~36) + SETERUSNYA(~48) + btn-row(~44) + padding(~24)
      var reserved = 220;
      // Anggaran ketinggian teks (~18px per 28 aksara pada width ~380)
      var textH = Math.ceil((textLen || 40) / 28) * 22;
      if (textH < 30) textH = 30;
      if (textH > 160) textH = 160;

      var maxImg = vh - reserved - textH;
      if (maxImg < 80) maxImg = 80;
      if (maxImg > 320) maxImg = 320;

      img.style.maxHeight = maxImg + 'px';
    }

    function cardsFromBahasaDrawer(d, isSR) {
      var out = [];
      var title = d.title || 'Laci';
      var tips0 = (d.tipsFasa0 || '').trim();
      var tips12 = (d.tips || '').trim();
      var img = d.imageUrl || '';
      var r, i;

      // F0 × 5
      for (r = 0; r < 5; r++) {
        out.push({
          front: title, back: '', tips: tips0, imageUrl: img,
          title: title, drawerId: d.id, isF0: true, isTamat: false, isSR: !!isSR, fasa: 0
        });
      }

      var notes = (d.notes || '').trim();
      var noteCards = [];
      if (notes) {
        var lines = notes.split('\n');
        for (i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          var parts = line.split('=');
          noteCards.push({
            front: parts[0].trim(),
            back: parts.length > 1 ? parts.slice(1).join('=').trim() : '',
            tips: tips12, imageUrl: img,
            title: title, drawerId: d.id, isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      }

      // F1 × 5 (setiap baris notes)
      for (r = 0; r < 5; r++) {
        for (i = 0; i < noteCards.length; i++) {
          var c1 = {};
          for (var k1 in noteCards[i]) c1[k1] = noteCards[i][k1];
          c1.fasa = 1;
          out.push(c1);
        }
      }

      // F2 × 5 (setiap baris notes)
      for (r = 0; r < 5; r++) {
        for (i = 0; i < noteCards.length; i++) {
          var c2 = {};
          for (var k2 in noteCards[i]) c2[k2] = noteCards[i][k2];
          c2.fasa = 2;
          out.push(c2);
        }
      }

      out.push({
        front: isSR ? ('SR selesai — ' + getLabelFasaSR((srLaciSemasa && srLaciSemasa.fasaSemasa) || 0)) : 'Laci Tamat. Tekan SETERUSNYA.',
        back: '', tips: '', imageUrl: '',
        title: title, drawerId: d.id, isF0: false, isTamat: true, isSR: !!isSR
      });
      return out;
    }
    
    function formatKtoBaris(text) {
      if (!text) return '';
      return text
        .replace(/\s*K(\d+)\s*:\s*/gi, '\n$1 : ')
        .replace(/\s+k(\d+)\s*/gi, '\n$1 : ')
        .replace(/^\n+/, '')
        .trim();
    }

      var itemCards = [];
      var i, r;

      if (d.items && d.items.length) {
        for (i = 0; i < d.items.length; i++) {
          var it = d.items[i];
          var ayat = (it.ayat || it.text || '').trim();
          if (!ayat) continue;
          var eq = ayat.indexOf('=');
          var depan = eq !== -1 ? ayat.slice(0, eq).trim() : ayat;
          var belakang = eq !== -1 ? ayat.slice(eq + 1).trim() : (it.maksud || '');
          itemCards.push({
            front: depan,
            back: formatKtoBaris(belakang),
            tips: tips,
            imageUrl: it.imageUrl || d.imageUrl || '',
            title: title, drawerId: d.id,
            isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      } else if (d.notes) {
        var lines = d.notes.split('\n');
        for (var j = 0; j < lines.length; j++) {
          var line = lines[j].trim();
          if (!line) continue;
          var eq2 = line.indexOf('=');
          var depan2 = eq2 !== -1 ? line.slice(0, eq2).trim() : line;
          var belakang2 = eq2 !== -1 ? line.slice(eq2 + 1).trim() : '';
          itemCards.push({
            front: depan2,
            back: formatKtoBaris(belakang2),
            tips: tips,
            imageUrl: d.imageUrl || '',
            title: title, drawerId: d.id,
            isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      }

      // Fakta: setiap baris ada F1×5 dan F2×5 berasingan
      // Aliran: F1(1/5→5/5) → [JQ Motivasi] → F2(1/5→5/5) → daftar SR → baris seterusnya
      for (i = 0; i < itemCards.length; i++) {
        // F1 × 5
        for (r = 0; r < 5; r++) {
          var cf1 = {};
          for (var kf1 in itemCards[i]) cf1[kf1] = itemCards[i][kf1];
          cf1.itemIndex = i;
          cf1.fasa = 1;
          cf1.isLastOfBaris = false;
          cf1.isEndF1 = (r === 4); // habis F1 → trigger motivasi JQ
          out.push(cf1);
        }
        // F2 × 5
        for (r = 0; r < 5; r++) {
          var cf2 = {};
          for (var kf2 in itemCards[i]) cf2[kf2] = itemCards[i][kf2];
          cf2.itemIndex = i;
          cf2.fasa = 2;
          cf2.isLastOfBaris = (r === 4); // habis F2 → daftar SR
          cf2.isEndF1 = false;
          out.push(cf2);
        }
      }

      out.push({
        front: isSR ? ('SR Fakta selesai — ' + getLabelFasaSR((srLaciSemasa && srLaciSemasa.fasaSemasa) || 0)) : 'Laci Tamat. Tekan SETERUSNYA.',
        back: '', tips: '', imageUrl: '',
        title: title, drawerId: d.id, isF0: false, isTamat: true, isSR: !!isSR
      });
      return out;
    }

    function loadSROverdue(colName) {
      return db.collection('users').doc(currentUser.uid).collection(colName).get()
        .then(function(snap) {
          var now = Date.now();
          var overdue = [];
          snap.forEach(function(doc) {
            var d = doc.data();
            d.id = doc.id;
            if (!d.nextDueAt || d.nextDueAt <= now) overdue.push(d);
          });
          overdue.sort(function(a, b) { return (a.nextDueAt || 0) - (b.nextDueAt || 0); });
          return overdue;
        });

    function daftarSRBaru(drawerId, modeName, itemIndex, barisText) {    
      var drawer, srColl;
      if (modeName === 'fakta') {
        drawer = allDrawers.filter(function(d) { return d.id === drawerId; })[0];
        srColl = 'fakta_sr_queue';
      } else {
        drawer = allBahasaDrawers.filter(function(d) { return d.id === drawerId; })[0];
        srColl = 'bahasa_sr_queue';
      }
      if (!drawer) return Promise.resolve();

      // Fakta: satu baris = satu SR (docId = drawerId_b{itemIndex})
      var srDocId = drawerId;
      if (modeName === 'fakta' && itemIndex !== undefined && itemIndex !== null) {
        srDocId = drawerId + '_b' + itemIndex;
      }

      var ref = db.collection('users').doc(currentUser.uid).collection(srColl).doc(srDocId);
      return ref.get().then(function(snap) {
        if (snap.exists) return;
        var now = Date.now();
        var srData = {
          drawerId: drawerId,
          drawerTitle: drawer.title || '',
          hafalAt: now,
          fasaSemasa: 0,
          nextDueAt: now + SR_INTERVALS[0],
          sejarahFasa: [],
          createdAt: now,
          mode: modeName,
          srDocId: srDocId
        };
        if (modeName === 'bahasa') {
          srData.perkataanId = drawer.perkataanId || '';
          srData.jenisId = drawer.jenisId || '';
        } else {
          srData.topicId = drawer.topicId || '';
          if (itemIndex !== undefined && itemIndex !== null) {
            srData.itemIndex = itemIndex;
            srData.barisText = (barisText || '').slice(0, 200);
          }
        }
        return ref.set(srData);
      });
    }

    function selesaiSRUlangan(srDocId, modeName) {
      var srColl = modeName === 'fakta' ? 'fakta_sr_queue' : 'bahasa_sr_queue';
      var docId = srDocId || '';
      var ref = db.collection('users').doc(currentUser.uid).collection(srColl).doc(docId);
      return ref.get().then(function(snap) {
        if (!snap.exists) return;
        var data = snap.data();
        var fasaBaru = (data.fasaSemasa || 0) + 1;
        var now = Date.now();
        var sejarah = (data.sejarahFasa || []).slice();
        sejarah.push({ fasa: data.fasaSemasa, selesaiAt: now, labelFasa: getLabelFasaSR(data.fasaSemasa) });
        return ref.update({
          fasaSemasa: fasaBaru,
          nextDueAt: now + getSRInterval(fasaBaru),
          sejarahFasa: sejarah,
          updatedAt: now
        });
      });
    }

    function rebuildBahasaCards() {
      activePerkataan = null;
      for (var i = 0; i < allBahasaPerkataan.length; i++) {
        if (allBahasaPerkataan[i].isActive) { activePerkataan = allBahasaPerkataan[i]; break; }
      }
      if (!activePerkataan) {
        cards = []; cardIndex = 0;
        setText('main-text', 'Tiada perkataan aktif.\nTick SATU perkataan di phone.');
        setText('play-mode', 'BAHASA');
        setText('play-status', 'Tiada perkataan aktif');
        setText('play-progress', ''); setText('play-meta', '');
        setCardImage('');
        return false;
      }

      var activeDrawers = allBahasaDrawers
        .filter(function(d) { return d.perkataanId === activePerkataan.id; })
        .sort(function(a, b) {
          return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true });
        });

      cards = [];
      for (var j = 0; j < activeDrawers.length; j++) {
        var d = activeDrawers[j];
        if ((d.notes || '').trim()) cards = cards.concat(cardsFromBahasaDrawer(d, false));
      }

      var saved = activePerkataan.lastIndex || 0;
      if (saved >= cards.length) saved = 0;
      if (cards[saved] && !cards[saved].isF0 && !cards[saved].isTamat) {
        for (var k = saved; k >= 0; k--) {
          if (cards[k].isF0 && cards[k].drawerId === cards[saved].drawerId) {
            saved = k; break;
          }
        }
      }
      cardIndex = saved;
      srModeAktif = false;
      srLaciSemasa = null;
      return cards.length > 0;
    }

    function rebuildFaktaCards() {
      activeTopic = null;
      for (var i = 0; i < allTopics.length; i++) {
        if (allTopics[i].isActive) { activeTopic = allTopics[i]; break; }
      }
      if (!activeTopic) {
        cards = []; cardIndex = 0;
        setText('main-text', 'Tiada topik aktif.\nTick SATU topik di phone.');

        setText('play-status', 'Tiada topik aktif');

        setCardImage('');

      }

      var activeDrawers = allDrawers
        .filter(function(d) { return d.topicId === activeTopic.id; })
        .sort(function(a, b) {
          return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true });
        });

      cards = [];
      for (var j = 0; j < activeDrawers.length; j++) {
        var d = activeDrawers[j];
        var has = (d.items && d.items.length) || (d.notes || '').trim();
        if (has) cards = cards.concat(cardsFromFaktaDrawer(d, false));
      }

      var saved = activeTopic.lastIndex || 0;
      if (saved >= cards.length) saved = 0;
      cardIndex = saved;
      srModeAktif = false;
      srLaciSemasa = null;
      return cards.length > 0;
    }

    function parseLaciQuran(title) {
      // Format title: "2. Al-Baqarah Ayat 1"
      var match = (title || '').match(/^(\d+)\.\s+(.+?)\s+Ayat\s+(\d+)$/i);
      if (!match) return null;
      return {
        surahNum: parseInt(match[1]),
        surahName: match[2].trim(),
        ayatNum: parseInt(match[3])
      };
    }

    function rebuildQuranCards() {
      var surahIdx = quranSurahSemasa - 1;
      if (surahIdx < 0) surahIdx = 0;
      if (surahIdx > 113) surahIdx = 113;
      var surahNum = surahIdx + 1;
      var surahName = QURAN_SURAH_NAMES[surahIdx];

      // Ambil semua drawer untuk surah ini, susun ikut title
      var activeDrawers = allQuranDrawers
        .filter(function(d) { return d.timeId === surahNum; })
        .sort(function(a, b) {
          return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true });
        });

      if (!activeDrawers.length) {
        cards = []; cardIndex = 0;
        setText('main-text', 'Tiada ayat untuk Surah ' + surahNum + '. ' + surahName + '.\nSila semak data di phone.');
        setText('play-mode', 'QURAN');
        setText('play-status', 'Tiada data');
        setText('play-progress', ''); setText('play-meta', '');
        setCardImage('');
        return false;
      }

      cards = [];
      for (var i = 0; i < activeDrawers.length; i++) {
        var d = activeDrawers[i];
        var parsed = parseLaciQuran(d.title);
        cards.push({
          front: (d.zikir || '').trim() || '(Kosong)',
          back: (d.maksud || '').trim(),
          tips: '',
          imageUrl: '',
          title: d.title || '',
          drawerId: d.id,
          surahNum: parsed ? parsed.surahNum : surahNum,
          ayatNum: parsed ? parsed.ayatNum : 0,
          isF0: false, isTamat: false, isSR: false,
          isQuran: true
        });
      }

      // Kad tamat surah
      cards.push({
        front: 'Surah ' + surahNum + '. ' + surahName + ' selesai.\nTekan SETERUSNYA untuk surah seterusnya.',
        back: '', tips: '', imageUrl: '',
        title: 'Tamat', drawerId: null,
        surahNum: surahNum, ayatNum: 0,
        isF0: false, isTamat: true, isSR: false,
        isQuran: true, isTamatSurah: true
      });

      // Cari kedudukan berdasarkan ayat terakhir yang disimpan
      var savedIdx = 0;
      if (quranAyatSemasa > 0) {
        for (var j = 0; j < cards.length; j++) {
          if (cards[j].ayatNum && cards[j].ayatNum <= quranAyatSemasa) {
            savedIdx = j;
          }
        }
        // Maju satu hanya kalau kad seterusnya bukan isTamat
        var nextIdx = savedIdx + 1;
        if (nextIdx < cards.length && !cards[nextIdx].isTamat) {
          savedIdx = nextIdx;
        }
      }
      cardIndex = savedIdx;
      return true;
    }

    // Fungsi yang sama untuk Rutin, Doa, Hadis
    function rebuildRutinLaciCards(modeName) {
      var timesArr, drawersArr;
      if (modeName === 'rutin') {
        timesArr = allRutinTimes; drawersArr = allRutinDrawers;
      } else if (modeName === 'doa') {
        timesArr = allDoaTimes; drawersArr = allDoaDrawers;
      } else {
        timesArr = allHadisTimes; drawersArr = allHadisDrawers;
      }

      // Cari times yang aktif
      var aktif = null;
      for (var i = 0; i < timesArr.length; i++) {
        if (timesArr[i].isActive) { aktif = timesArr[i]; break; }
      }

      var labelMod = modeName === 'rutin' ? 'Rutin' : modeName === 'doa' ? 'Doa' : 'Hadis';

      if (!aktif) {
        cards = []; cardIndex = 0;
        setText('main-text', 'Tiada ' + labelMod + ' aktif.\nTick SATU ' + labelMod + ' di phone.');
        setText('play-mode', labelMod.toUpperCase());
        setText('play-status', 'Tiada ' + labelMod + ' aktif');
        setText('play-progress', ''); setText('play-meta', '');
        setCardImage('');
        return false;
      }

      // Ambil drawers untuk times ini
      var activeDrawers = drawersArr
        .filter(function(d) { return d.timeId === aktif.id; })
        .sort(function(a, b) {
          return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true });
        });

      cards = [];
      for (var j = 0; j < activeDrawers.length; j++) {
        var d = activeDrawers[j];

        // Format notes: "zikir=bilangan=maksud" per baris
        if (d.notes && !d.zikir) {
          var lines = d.notes.split('\n');
          for (var k = 0; k < lines.length; k++) {
            var line = lines[k].trim();
            if (!line) continue;
            var parts = line.split('=');
            var zikirText = (parts[0] || '').trim() || 'Kosong';
            // Format 3 bahagian: zikir=bilangan=maksud → ambil bahagian ke-3
            // Format 2 bahagian: zikir=maksud → ambil bahagian ke-2
            var maksudText = parts.length >= 3 ? parts[2].trim() : (parts[1] ? parts[1].trim() : '');
            cards.push({
              front: zikirText,
              back: maksudText,
              tips: '',
              imageUrl: '',
              title: d.title || labelMod,
              drawerId: d.id,
              timesId: aktif.id,
              isF0: false, isTamat: false, isSR: false,
              isRutin: true, modeName: modeName
            });
          }
        } else if (d.zikir || d.maksud) {
          cards.push({
            front: (d.zikir || '').trim() || (d.maksud || '').trim() || 'Kosong',
            back: d.zikir ? (d.maksud || '').trim() : '',
            tips: '',
            imageUrl: '',
            title: d.title || labelMod,
            drawerId: d.id,
            timesId: aktif.id,
            isF0: false, isTamat: false, isSR: false,
            isRutin: true, modeName: modeName
          });
        }
      }

      if (!cards.length) {
        setText('main-text', 'Tiada kandungan dalam ' + labelMod + ' ini.\nSila tambah di phone.');
        setText('play-mode', labelMod.toUpperCase());
        setText('play-status', 'Tiada kandungan');
        setText('play-progress', ''); setText('play-meta', '');
        setCardImage('');
        return false;
      }

      // Kad tamat
      cards.push({
        front: labelMod + ' selesai. Tekan SETERUSNYA untuk ulang semula.',
        back: '', tips: '', imageUrl: '',
        title: 'Tamat', drawerId: null,
        timesId: aktif.id,
        isF0: false, isTamat: true, isSR: false,
        isRutin: true, modeName: modeName,
        isTamatRutin: true
      });

      // Restore lastIndex
      var saved = aktif.lastIndex || 0;
      if (saved >= cards.length) saved = 0;
      cardIndex = saved;

      // Simpan aktifId dalam variable global mengikut mod
      if (modeName === 'rutin') activeRutinTimeId = aktif.id;
      else if (modeName === 'doa') activeDoaTimeId = aktif.id;
      else activeHadisTimeId = aktif.id;

      return true;
    }

    function loadSRIntoCards(srData, modeName) {    
      var drawer;
      if (modeName === 'bahasa') {
        drawer = allBahasaDrawers.filter(function(d) { return d.id === (srData.drawerId || srData.id); })[0];
        if (!drawer) return false;
        cards = cardsFromBahasaDrawer(drawer, true);
      } else {
        drawer = allDrawers.filter(function(d) { return d.id === (srData.drawerId || srData.id); })[0];
        if (!drawer) return false;
        cards = cardsFromFaktaDrawer(drawer, true);
      }
      cardIndex = 0;
      srModeAktif = true;
      srLaciSemasa = srData;
      return true;
    }

    function startBahasa() {
      if (isLoading) return;
      isLoading = true;
      mode = 'bahasa';
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      terskipCards = []; terskipIdx = 0;
      setText('play-status', 'Memuat Bahasa + SR...');
      setText('play-err', '');
      showScreen('screen-play');

      loadCollections(function() {
        loadSROverdue('bahasa_sr_queue').then(function(overdue) {
          srQueue = overdue;
          if (srQueue.length) {
            srLaciSemasa = srQueue.shift();
            if (loadSRIntoCards(srLaciSemasa, 'bahasa')) {
              setText('play-status', 'SR BAHASA · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
              isLoading = false; renderCard(); return;
            }
          }
          if (rebuildBahasaCards()) {
            setText('play-status', 'BAHASA · ' + (activePerkataan.name || ''));
          }
          isLoading = false; renderCard();
        }).catch(function(e) {
          isLoading = false;
          setText('play-err', e.message);
          rebuildBahasaCards(); renderCard();
        });
      });
    }

    function startFakta() {
      if (isLoading) return;
      isLoading = true;
      mode = 'fakta';
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      terskipCards = []; terskipIdx = 0;
      setText('play-status', 'Memuat Fakta + SR...');
      setText('play-err', '');
      showScreen('screen-play');

      loadCollections(function() {
        loadSROverdue('fakta_sr_queue').then(function(overdue) {
          srQueue = overdue;
          if (srQueue.length) {
            srLaciSemasa = srQueue.shift();
            if (loadSRIntoCards(srLaciSemasa, 'fakta')) {
              setText('play-status', 'SR FAKTA · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
              isLoading = false; renderCard(); return;
            }
          }
          if (rebuildFaktaCards()) {
            setText('play-status', 'FAKTA · ' + (activeTopic.name || ''));
          }
          isLoading = false; renderCard();
        }).catch(function(e) {
          isLoading = false;
          setText('play-err', e.message);
          rebuildFaktaCards(); renderCard();
        });
      });
    }

    function startQuran() {
      if (isLoading) return;
      isLoading = true;
      mode = 'quran';
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      quranAyatCounter = 0;
      terskipCards = []; terskipIdx = 0;
      setText('play-status', 'Memuat Quran...');
      setText('play-err', '');
      showScreen('screen-play');

      function terusStartQuran() {
        var ok = rebuildQuranCards();
        if (ok) {
          setText('play-status', 'QURAN · ' + quranSurahSemasa + '. ' + QURAN_SURAH_NAMES[quranSurahSemasa - 1]);

    function startRutinMod(modeName) {
      if (isLoading) return;
      isLoading = true;
      mode = modeName;
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      terskipCards = []; terskipIdx = 0;
      var labelMod = modeName === 'rutin' ? 'Rutin' : modeName === 'doa' ? 'Doa' : 'Hadis';
      setText('play-status', 'Memuat ' + labelMod + '...');
      setText('play-err', '');
      showScreen('screen-play');

      function terusStartRutin() {
        var ok = rebuildRutinLaciCards(modeName);
        var aktifId = modeName === 'rutin' ? activeRutinTimeId : modeName === 'doa' ? activeDoaTimeId : activeHadisTimeId;
        if (ok && aktifId) {
          setText('play-status', labelMod + ' · ' + getNamaTimes(modeName, aktifId));
        }
        isLoading = false;
        renderCard();
      }

      // Semak sama ada mana-mana array belum siap
      var timesArr = modeName === 'rutin' ? allRutinTimes : modeName === 'doa' ? allDoaTimes : allHadisTimes;
      var drawersArr = modeName === 'rutin' ? allRutinDrawers : modeName === 'doa' ? allDoaDrawers : allHadisDrawers;

      if (!timesArr.length || !drawersArr.length) {
        setText('main-text', 'Sedang memuat data...');
        setTimeout(terusStartRutin, 2000);
        return;
      }

      terusStartRutin();

    // Helper — ambil nama times aktif
    function getNamaTimes(modeName, aktifId) {
      var timesArr = modeName === 'rutin' ? allRutinTimes : modeName === 'doa' ? allDoaTimes : allHadisTimes;
      for (var i = 0; i < timesArr.length; i++) {
        if (timesArr[i].id === aktifId) return timesArr[i].name || '';
      }
      return '';
    }

    function startRutin() { startRutinMod('rutin'); }
    function startDoa()   { startRutinMod('doa'); }
    function startHadis() { startRutinMod('hadis'); }

    function setCardImage(url) {    
      var img = document.getElementById('card-img');
      if (!img) return;
      if (url) {
        img.src = url;
        img.style.display = 'block';
        img.onerror = function() { img.style.display = 'none'; };
        img.onload = function() { autoFitImage((document.getElementById('main-text').textContent || '').length); };
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
        img.style.maxHeight = '';
      }
    }

    function renderCard() {
      var mainEl = document.getElementById('main-text');
      if (!cards.length) {
        setText('main-text', 'Tiada kad');
        mainEl.className = 'big-text';
        setCardImage('');
        return;
      }
      if (cardIndex >= cards.length) {
        setText('main-text', 'Selesai');
        mainEl.className = 'big-text';
        setText('side-label', '');
        setText('play-progress', '');
        setCardImage('');
        return;
      }

      var c = cards[cardIndex];
      var fasaLabel = '';
      if (c.isTamat) {
        fasaLabel = 'TAMAT';
      } else if (mode === 'quran') {
        fasaLabel = c.title || 'QURAN';
      } else if (mode === 'rutin' || mode === 'doa' || mode === 'hadis') {
        fasaLabel = c.title || mode.toUpperCase();
      } else if (mode === 'bahasa') {
        if (c.isF0 || c.fasa === 0) fasaLabel = 'F0 · Pengenalan';
        else if (c.fasa === 1) fasaLabel = 'F1 · Latihan';
        else if (c.fasa === 2) fasaLabel = 'F2 · Ulangan';
      } else {
        fasaLabel = c.title || '';
      }

      if (mode === 'fakta' && !c.isTamat && !c.isF0) {
        fasaLabel = (c.fasa === 1 ? 'F1' : 'F2') + ' · ' + (c.title || '');
      }
      var label = (srModeAktif ? 'SR · ' : '') + fasaLabel;
      setText('play-mode', label);

      // Progress — Quran tunjuk nombor ayat, Rutin/Doa/Hadis tunjuk kedudukan biasa
      if (mode === 'quran') {
        setText('play-progress', c.isTamat ? '' : (c.ayatNum ? 'Ayat ' + c.ayatNum : ''));
      } else if (mode === 'rutin' || mode === 'doa' || mode === 'hadis') {
        var totalBukan = cards.filter(function(x) { return !x.isTamat; }).length;
        setText('play-progress', c.isTamat ? '' : ((cardIndex + 1) + ' / ' + totalBukan));
      } else {
        // Bahasa / Fakta — progress asal
        var fasaSemasa = c.isF0 ? 0 : (c.fasa !== undefined ? c.fasa : -1);
        var fasaStart = cardIndex, fasaEnd = cardIndex;
        for (var pi = 0; pi < cards.length; pi++) {
          if (cards[pi].isTamat) continue;
          var pf = cards[pi].isF0 ? 0 : (cards[pi].fasa !== undefined ? cards[pi].fasa : -1);
          var sameLaci = (mode === 'fakta')
            ? (cards[pi].drawerId === c.drawerId && cards[pi].itemIndex === c.itemIndex)
            : true;
          if (pf === fasaSemasa && sameLaci) {
            if (pi < fasaStart) fasaStart = pi;
            if (pi > fasaEnd) fasaEnd = pi;
          }
        }
        var fasaPos = cardIndex - fasaStart + 1;
        var fasaTotal = fasaEnd - fasaStart + 1;
        setText('play-progress', c.isTamat ? '' : (fasaPos + ' / ' + fasaTotal));
      }

      setText('play-meta', '');

      // Tunjuk/sembunyi butang Terskip vs Tips ikut mod
      var btnTips = document.getElementById('btn-tips');
      if (btnTips) {
        btnTips.textContent = mode === 'quran' ? 'Terskip' : 'Tips';
      }

      var displayText = '';
      if (showTips && mode !== 'quran') {
        // Tips mod (bukan Quran)
        setText('side-label', c.isF0 ? 'TIPS F0' : 'TIPS F1&2');
        displayText = c.tips ? c.tips : '(Tiada tips)';
        setText('main-text', displayText);
        mainEl.className = 'big-text tips-mode';
        document.getElementById('btn-tips').className = 'btn-sm on';
        document.getElementById('btn-flip').className = 'btn-sm';
        setCardImage('');
      } else if (isFlipped) {
        setText('side-label', mode === 'quran' ? 'TERJEMAHAN' : 'MUKA BELAKANG');
        displayText = c.back || '(Tiada maksud)';
        setText('main-text', displayText);
        mainEl.className = displayText.length > 80 ? 'big-text long-text' : 'big-text';
        document.getElementById('btn-flip').className = 'btn-sm on';
        document.getElementById('btn-tips').className = 'btn-sm';
        if (c.imageUrl) setCardImage(c.imageUrl);
        else setCardImage('');
      } else {
        setText('side-label', 'MUKA DEPAN');
        displayText = c.front || '(kosong)';
        setText('main-text', displayText);
        // Mod Quran — guna font Arab, teks muka depan
        if (mode === 'quran' && !c.isTamat) {
          mainEl.className = 'big-text quran-text';
        } else {
          mainEl.className = displayText.length > 80 ? 'big-text long-text' : 'big-text';
        }
        document.getElementById('btn-flip').className = 'btn-sm';
        document.getElementById('btn-tips').className = 'btn-sm';
        if (c.imageUrl) setCardImage(c.imageUrl);
        else setCardImage('');
      }

      setTimeout(function() {
        autoFitImage(displayText.length);
      }, 50);
    }

    function findNextDrawerStart(fromIdx) {
      var i = fromIdx + 1;
      while (i < cards.length && !cards[i].isF0 && !cards[i].isTamat) i++;
      if (i < cards.length && cards[i].isTamat) i++;
      return i;
    }

    function lompatPerkataanSeterusnya() {
      if (!activePerkataan) return Promise.resolve(false);
      var sorted = allBahasaPerkataan
        .filter(function(p) { return p.jenisId === activePerkataan.jenisId; })
        .sort(function(a, b) {
          return (a.name || '').localeCompare(b.name || '', undefined, { numeric: true });
        });
      var idx = -1;
      for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].id === activePerkataan.id) { idx = i; break; }
      }
      if (idx < 0 || idx >= sorted.length - 1) return Promise.resolve(false);

      var next = sorted[idx + 1];
      var batch = db.batch();
      var uid = currentUser.uid;
      for (var j = 0; j < allBahasaPerkataan.length; j++) {
        if (allBahasaPerkataan[j].isActive) {
          batch.update(db.collection('users').doc(uid).collection('bahasa_perkataan').doc(allBahasaPerkataan[j].id), { isActive: false });
          allBahasaPerkataan[j].isActive = false;
        }
      }
      batch.update(db.collection('users').doc(uid).collection('bahasa_perkataan').doc(next.id), { isActive: true, lastIndex: 0 });
      next.isActive = true;
      next.lastIndex = 0;

      return batch.commit().then(function() {
        activePerkataan = next;
        rebuildBahasaCards();
        setText('play-status', 'BAHASA · ' + (next.name || ''));
        if (jqAktif && jqMotivasiList.length) {
          tunjukMotivasiJQ(function() { renderCard(); });
        } else {
          renderCard();
        }
        return true;
      }).catch(function() { return false; });
    }

    function afterTamat(c) {
      isBusy = true;
      setText('play-err', 'Menyimpan...');
      var drawerId = c.drawerId;
      var isSR = c.isSR || srModeAktif;
      var nextIdx = findNextDrawerStart(cardIndex);
      var isLast = nextIdx >= cards.length;
      var srCol = mode === 'fakta' ? 'fakta_sr_queue' : 'bahasa_sr_queue';

      // Selepas simpan: check SR overdue dulu (mirrors phone)
      function terusSelepasSR() {
        loadSROverdue(srCol).then(function(overdue) {
          srQueue = overdue || [];
          if (srQueue.length) {
            srLaciSemasa = srQueue.shift();
            if (loadSRIntoCards(srLaciSemasa, mode)) {
              setText('play-status', (mode === 'bahasa' ? 'SR BAHASA' : 'SR FAKTA') + ' · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
              isFlipped = false; showTips = false; isBusy = false;
              setText('play-err', ''); renderCard();
              return;
            }
          }
          // Tiada SR due → laci / perkataan seterusnya
          if (!isSR && isLast && mode === 'bahasa') {
            lompatPerkataanSeterusnya().then(function(ok) {
              isBusy = false; setText('play-err', '');
              if (!ok) {
                setText('main-text', 'Habis semua perkataan dalam jenis kata ini.');
                setText('side-label', ''); setCardImage('');
              }
            });
            return;
          }
          if (!isSR && isLast && mode === 'fakta') {
            cardIndex = 0; syncIndex(0); isBusy = false; setText('play-err', '');
            setText('main-text', 'Habis semua laci topik ini. (Kitar semula dari awal)');
            setText('side-label', ''); setCardImage('');
            return;
          }
          if (isSR) {
            // Lepas SR: rebuild countdown normal dari lastIndex
            var ok = mode === 'bahasa' ? rebuildBahasaCards() : rebuildFaktaCards();
            if (!ok) { isBusy = false; setText('play-err', ''); return; }
            isFlipped = false; showTips = false;
            setText('play-status', mode === 'bahasa'
              ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
              : ('FAKTA · ' + ((activeTopic && activeTopic.name) || '')));
            isBusy = false; setText('play-err', ''); renderCard();
            return;
          }
          // Laci biasa selesai, ada laci seterusnya
          cardIndex = nextIdx; syncIndex(cardIndex);
          isFlipped = false; showTips = false; isBusy = false;
          setText('play-err', '');
          // JQ: tunjuk motivasi dulu sebelum laci seterusnya
          if (jqAktif && jqMotivasiList.length) {
            tunjukMotivasiJQ(function() {
              setText('play-status', mode === 'bahasa'
                ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
                : ('FAKTA · ' + ((activeTopic && activeTopic.name) || '')));
              renderCard();
            });
            return;
          }
          setText('play-status', mode === 'bahasa'
            ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
            : ('FAKTA · ' + ((activeTopic && activeTopic.name) || '')));
          renderCard();
        }).catch(function(e) {
          isBusy = false; setText('play-err', e.message || 'Gagal check SR');
        });
      }

      // isTamat fakta: SR sudah didaftar per-baris dalam nextCard; jangan daftar semula whole-laci
      var srId = (srLaciSemasa && (srLaciSemasa.srDocId || srLaciSemasa.id)) || drawerId;
      var p = isSR
        ? selesaiSRUlangan(srId, mode)
        : (mode === 'fakta' ? Promise.resolve() : daftarSRBaru(drawerId, mode));

      p.then(function() {
        terusSelepasSR();
      }).catch(function(e) {
        isBusy = false; setText('play-err', e.message || 'Gagal simpan');
      });
    }  

    function syncLastIndexRutin(modeName, timesId, newIndex) {
      if (!currentUser || !timesId) return;
      var collName = modeName === 'rutin' ? 'routine_times' : modeName === 'doa' ? 'doa_times' : 'hadis_times';
      db.collection('users').doc(currentUser.uid)
        .collection(collName).doc(timesId)
        .update({ lastIndex: newIndex }).catch(function() {});
    }

    function nextCard() {
      if (isBusy) return;

      // Mode motivasi JQ — tekan SETERUSNYA → ikut cara app pertama
      if (window._jqMotivasiHandler) {
        var h = window._jqMotivasiHandler;
        if (h.adaFlip && !h.flipped) {
          // Tap pertama — tunjuk belakang
          h.flipped = true;
          setText('side-label', 'MUKA BELAKANG');
          setText('main-text', h.belakang);
          setText('play-progress', '(Tekan SETERUSNYA untuk teruskan)');
          var mainElM = document.getElementById('main-text');
          if (mainElM) mainElM.className = h.belakang.length > 80 ? 'big-text long-text' : 'big-text';
          document.getElementById('btn-flip').className = 'btn-sm on';
          return;
        }
        // Tap terakhir — selesai motivasi, sambung
        var cbM = h.cb;
        _selesaiMotivasi();
        if (cbM) cbM();
        return;
      }

      if (!cards.length || cardIndex >= cards.length) return;
      var c = cards[cardIndex];

      // ── MOD QURAN ──
      if (mode === 'quran') {
        // Kalau terskip aktif — SETERUSNYA maju dalam terskip, bukan kad utama
        if (terskipCards.length > 0) {
          if (!isFlipped && terskipCards[terskipIdx] && terskipCards[terskipIdx].back) {
            isFlipped = true;
            setText('side-label', 'MUKA BELAKANG');
            setText('main-text', terskipCards[terskipIdx].back);
            var mainElN = document.getElementById('main-text');
            if (mainElN) mainElN.className = terskipCards[terskipIdx].back.length > 80 ? 'big-text long-text' : 'big-text';
            document.getElementById('btn-flip').className = 'btn-sm on';
            return;
          }
          terskipIdx++;
          if (terskipIdx >= terskipCards.length) {
            terskipCards = []; terskipIdx = 0;
            setText('play-err', '');
            setText('play-status', 'QURAN · ' + quranSurahSemasa + '. ' + QURAN_SURAH_NAMES[quranSurahSemasa - 1]);
            isFlipped = false; showTips = false;
            renderCard();
            return;
          }
          isFlipped = false;
          renderTerskip();
          return;
        }

        if (c.isTamat && c.isTamatSurah) {
          // Habis surah — maju ke surah seterusnya
          isBusy = true;
          setText('play-err', 'Menyimpan...');
          var surahBaru = quranSurahSemasa + 1;
          if (surahBaru > 114) {
            // Habis semua surah
            isBusy = false;
            setText('play-err', '');
            setText('main-text', 'Tahniah! Al-Quran selesai.');
            setText('side-label', ''); setCardImage('');
            return;
          }
          simpanProgressQuran(surahBaru, 1, true).then(function() {
            quranAyatCounter = 0;
            isBusy = false;
            setText('play-err', '');
            var ok = rebuildQuranCards();
            if (ok) {
              setText('play-status', 'QURAN · ' + quranSurahSemasa + '. ' + QURAN_SURAH_NAMES[quranSurahSemasa - 1]);
            }
            isFlipped = false; showTips = false;
            renderCard();
          }).catch(function() {
            isBusy = false;
            setText('play-err', 'Gagal simpan. Cuba reload.');
          });
          return;
        }

        // Kad biasa — dua langkah: Arab dulu, pastu terjemahan, baru maju
        if (!isFlipped && c.back) {
          // Langkah 1 — tunjuk terjemahan
          isFlipped = true;
          var mainElQ = document.getElementById('main-text');
          setText('side-label', 'TERJEMAHAN');
          setText('main-text', c.back);
          if (mainElQ) mainElQ.className = c.back.length > 80 ? 'big-text long-text' : 'big-text';
          document.getElementById('btn-flip').className = 'btn-sm on';
          return;
        }

        // Langkah 2 — maju ke ayat seterusnya
        var ayatSelesai = c.ayatNum || 0;
        isFlipped = false; showTips = false;
        cardIndex++;
        if (ayatSelesai > 0) {
          var jumlahAyatSurah = QURAN_SURAH_AYAT[quranSurahSemasa - 1] || 0;
          var patutSave = (ayatSelesai % 5 === 0) || (ayatSelesai === jumlahAyatSurah);
          if (patutSave) {
            isBusy = true;
            simpanProgressQuran(quranSurahSemasa, ayatSelesai, false).then(function() {
              quranAyatCounter = 0;
              isBusy = false;
              renderCard();
            }).catch(function() {
              isBusy = false;
              renderCard();
            });
            return;
          }
        }
        renderCard();
        return;
      }

      // ── MOD RUTIN / DOA / HADIS ──
      if (mode === 'rutin' || mode === 'doa' || mode === 'hadis') {
        if (c.isTamat && c.isTamatRutin) {
          // Habis — ulang semula dari awal
          cardIndex = 0;
          isFlipped = false; showTips = false;
          var aktifIdRutin = mode === 'rutin' ? activeRutinTimeId : mode === 'doa' ? activeDoaTimeId : activeHadisTimeId;
          syncLastIndexRutin(mode, aktifIdRutin, 0);
          renderCard();
          return;
        }
        // Kad biasa — maju
        isFlipped = false; showTips = false;
        cardIndex++;
        if (cardIndex >= cards.length) cardIndex = 0;
        var aktifId = mode === 'rutin' ? activeRutinTimeId : mode === 'doa' ? activeDoaTimeId : activeHadisTimeId;
        syncLastIndexRutin(mode, aktifId, cardIndex);
        renderCard();
        return;
      }

      if (c.isTamat) { afterTamat(c); return; }

      // Fakta F1 habis (isEndF1) → tunjuk motivasi JQ, kemudian sambung ke F2
      if (mode === 'fakta' && !srModeAktif && c.isEndF1) {
        isFlipped = false; showTips = false;
        cardIndex++;
        syncIndex(cardIndex);
        if (jqAktif && jqMotivasiList.length) {
          var f2Index = cardIndex;
          tunjukMotivasiJQ(function() {
            cardIndex = f2Index;
            setText('play-status', 'FAKTA · ' + ((activeTopic && activeTopic.name) || ''));
            renderCard();
          });
        } else {
          renderCard();
        }
        return;
      }

      // Fakta F2 habis (isLastOfBaris) → daftar SR untuk baris ini
      if (mode === 'fakta' && !srModeAktif && c.isLastOfBaris && c.drawerId != null && c.itemIndex != null) {
        isBusy = true;
        setText('play-err', 'Daftar SR baris...');
        daftarSRBaru(c.drawerId, 'fakta', c.itemIndex, c.front).then(function() {
          isBusy = false;
          setText('play-err', '');
          isFlipped = false; showTips = false;
          cardIndex++;
          if (cardIndex < cards.length) { syncIndex(cardIndex); renderCard(); }
          else renderCard();
        }).catch(function(e) {
          isBusy = false;
          setText('play-err', e.message || 'Gagal SR');
        });
        return;
      }

      // Reset flip hanya bila tukar fasa, kekal flip dalam fasa yang sama
      var fasaSebelum = c.isF0 ? 0 : (c.fasa !== undefined ? c.fasa : -1);
      var nextC = cards[cardIndex + 1];
      var fasaSelepas = nextC ? (nextC.isF0 ? 0 : (nextC.fasa !== undefined ? nextC.fasa : -1)) : -1;
      if (fasaSelepas !== fasaSebelum) { isFlipped = false; showTips = false; }

      cardIndex++;
      if (cardIndex < cards.length) { syncIndex(cardIndex); renderCard(); }
      else renderCard();
    }

    function cubaLoginPin() {
      var pin = document.getElementById('pin-input').value.trim();
      if (!pin || !/^\d{4,6}$/.test(pin)) {
        setText('login-msg', 'PIN mesti 4-6 digit'); return;
      }
      setText('login-msg', 'Mengesahkan...');
      document.getElementById('btn-login').disabled = true;
      auth.signInWithEmailAndPassword(ADMIN_EMAIL, pin)
        .then(function() {
          document.getElementById('pin-input').value = '';
          setText('login-msg', '');
        })
        .catch(function(e) {
          document.getElementById('btn-login').disabled = false;
          if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
            setText('login-msg', 'PIN salah');
          } else if (e.code === 'auth/user-not-found') {
            setText('login-msg', 'PIN belum setup di phone');
          } else {
            setText('login-msg', e.message || e.code);
          }
        });
    }

    // ── JQ BUTTON HANDLER ──
    document.getElementById('btn-jq').onclick = function() {
      if (isLoading) return;
      if (jqAktif) {
        // Terus OFF tanpa PIN
        jqAktif = false;
        simpanJQStatus(false);
        updateJQButton();
      } else {
        // Perlukan PIN untuk ON
        document.getElementById('jq-pin-input').value = '';
        setText('jq-pin-msg', '');
        var overlay = document.getElementById('jq-overlay');
        overlay.style.display = 'none';
        overlay.style.display = 'block';
        setTimeout(function() { document.getElementById('jq-pin-input').focus(); }, 100);
      }
    };

    document.getElementById('jq-pin-ok').onclick = function() {
      var pin = document.getElementById('jq-pin-input').value.trim();
      if (!pin || !/^\d{4,6}$/.test(pin)) {
        setText('jq-pin-msg', 'PIN mesti 4-6 digit'); return;
      }
      setText('jq-pin-msg', 'Mengesahkan...');
      document.getElementById('jq-pin-ok').disabled = true;
      auth.signInWithEmailAndPassword(ADMIN_EMAIL, pin)
        .then(function() {
          document.getElementById('jq-overlay').style.display = 'none';
          document.getElementById('jq-pin-ok').disabled = false;
          jqAktif = true;
          simpanJQStatus(true);
          updateJQButton();
        })
        .catch(function(e) {
          document.getElementById('jq-pin-ok').disabled = false;
          if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
            setText('jq-pin-msg', 'PIN salah');
          } else {
            setText('jq-pin-msg', e.message || e.code);
          }
        });
    };

    document.getElementById('jq-pin-batal').onclick = function() {
      document.getElementById('jq-overlay').style.display = 'none';
    };

    document.getElementById('jq-pin-input').onkeydown = function(e) {
      if (e.key === 'Enter') document.getElementById('jq-pin-ok').click();
    };

    document.getElementById('btn-login').onclick = cubaLoginPin;    
    document.getElementById('pin-input').onkeydown = function(e) {
      if (e.key === 'Enter') cubaLoginPin();
    };
    document.getElementById('btn-logout').onclick = function() { auth.signOut(); };
    document.getElementById('btn-go-bahasa').onclick = startBahasa;
    document.getElementById('btn-go-fakta').onclick = startFakta;
    document.getElementById('btn-go-quran').onclick = startQuran;
    document.getElementById('btn-go-rutin').onclick = startRutin;
    document.getElementById('btn-go-doa').onclick = startDoa;
    document.getElementById('btn-go-hadis').onclick = startHadis;
    document.getElementById('btn-back-menu').onclick = function() {
    terskipCards = []; terskipIdx = 0;
      isFlipped = false; showTips = false;
      showScreen('screen-menu');
    };
    document.getElementById('btn-reload').onclick = function() {
      isLoading = false;
      if (mode === 'bahasa') startBahasa();
      else if (mode === 'fakta') startFakta();
      else if (mode === 'quran') startQuran();
      else if (mode === 'rutin') startRutin();
      else if (mode === 'doa') startDoa();
      else if (mode === 'hadis') startHadis();
    };
    document.getElementById('btn-next').onclick = nextCard;
    document.getElementById('btn-flip').onclick = function() {
      // Terskip aktif — flip dihandle dalam btn-tips
      if (mode === 'quran' && terskipCards.length > 0) return;

      if (window._jqMotivasiHandler) {
        var h = window._jqMotivasiHandler;
        if (!h.adaFlip) return;
        h.flipped = !h.flipped;
        setText('side-label', h.flipped ? 'MUKA BELAKANG' : 'MUKA DEPAN');
        var txt = h.flipped ? h.belakang : h.depan;
        setText('main-text', txt);
        setText('play-progress', h.flipped ? '(Tekan SETERUSNYA untuk teruskan)' : '(Flip untuk penerangan)');
        var mainEl = document.getElementById('main-text');
        if (mainEl) mainEl.className = txt.length > 80 ? 'big-text long-text' : 'big-text';
        document.getElementById('btn-flip').className = h.flipped ? 'btn-sm on' : 'btn-sm';
        return;
      }
      if (!cards.length || cardIndex >= cards.length) return;
      if (cards[cardIndex].isTamat) return;
      showTips = false; isFlipped = !isFlipped; renderCard();
    };

    var isLoading = false; // guard untuk elak double-trigger button
    var terskipCards = []; // kad terskip Quran semasa
    var terskipIdx = 0;
    
        function bukaTerskip() {
      if (!cards.length || cardIndex <= 0) {
        setText('play-err', 'Tiada ayat sebelum ini.');
        setTimeout(function() { setText('play-err', ''); }, 2000);
        return;
      }
      // Ambil sehingga 5 kad sebelum cardIndex, skip kad isTamat
      var mula = Math.max(0, cardIndex - 5);
      terskipCards = cards.slice(mula, cardIndex).filter(function(x) { return !x.isTamat; });
      if (!terskipCards.length) {
        setText('play-err', 'Tiada ayat untuk disemak.');
        setTimeout(function() { setText('play-err', ''); }, 2000);
        return;
      }
      terskipIdx = 0;
      renderTerskip();
    }

    function renderTerskip() {
      if (!terskipCards.length) return;
      var t = terskipCards[terskipIdx];
      var total = terskipCards.length;
      isFlipped = false;
      setText('play-status', 'TERSKIP · ' + (terskipIdx + 1) + '/' + total);
      setText('play-mode', t.title || 'QURAN');
      setText('side-label', 'ARAB');
      setText('play-progress', t.ayatNum ? 'Ayat ' + t.ayatNum : '');
      setText('play-meta', '');
      setText('play-err', '');
      setText('main-text', t.front || '');
      var mainEl = document.getElementById('main-text');
      if (mainEl) mainEl.className = 'big-text quran-text';
      document.getElementById('btn-flip').className = 'btn-sm';
      document.getElementById('btn-tips').className = 'btn-sm on'; // tanda terskip aktif
      setCardImage('');
    }

    document.getElementById('btn-tips').onclick = function() {
      if (!cards.length || cardIndex >= cards.length) return;

      // Mod Quran — butang ini jadi Terskip
      if (mode === 'quran') {
        // Kalau sedang dalam terskip — flip atau maju
        if (terskipCards.length > 0) {
          if (!isFlipped && terskipCards[terskipIdx] && terskipCards[terskipIdx].back) {
            // Tunjuk terjemahan
            isFlipped = true;
            setText('side-label', 'TERJEMAHAN');
            setText('main-text', terskipCards[terskipIdx].back);
            var mainElT = document.getElementById('main-text');
            if (mainElT) mainElT.className = terskipCards[terskipIdx].back.length > 80 ? 'big-text long-text' : 'big-text';
            document.getElementById('btn-flip').className = 'btn-sm on';
            return;
          }
          // Maju atau keluar terskip
          terskipIdx++;
          if (terskipIdx >= terskipCards.length) {
            // Habis terskip — kembali ke kad semasa
            terskipCards = [];
            terskipIdx = 0;
            setText('play-err', '');
            var aktifSurahLabel = 'QURAN · ' + quranSurahSemasa + '. ' + QURAN_SURAH_NAMES[quranSurahSemasa - 1];
            setText('play-status', aktifSurahLabel);
            isFlipped = false; showTips = false;
            renderCard();
            return;
          }
          isFlipped = false;
          renderTerskip();
          return;
        }
        // Mula terskip
        bukaTerskip();
        return;
      }

      // Mod lain — Tips biasa
      if (cards[cardIndex].isTamat) return;
      isFlipped = false; showTips = !showTips; renderCard();
    };

    window.addEventListener('resize', function() {
      var t = (document.getElementById('main-text').textContent || '').length;
      autoFitImage(t);
    });

    auth.onAuthStateChanged(function(user) {
      currentUser = user;
      document.getElementById('btn-login').disabled = false;
      if (user) {
        setText('menu-user', 'Linked · Login OK');
        loadJQStatus();
        subscribeJoggingMotivasi();
        subscribeModTambahan();
        showScreen('screen-menu');
      } else {
        if (_jqMotivasiUnsubscribe) { _jqMotivasiUnsubscribe(); _jqMotivasiUnsubscribe = null; }
        unsubscribeModTambahan();
        window._jqMotivasiHandler = null;
        jqAktif = false;
        jqMotivasiList = [];
        jqPendingCardIndex = -1;
        quranSurahSemasa = 1;
        quranAyatSemasa = 0;
        quranAyatCounter = 0;
        activeRutinTimeId = null;
        activeDoaTimeId = null;
        activeHadisTimeId = null;
        terskipCards = []; terskipIdx = 0;
        updateJQButton();
        showScreen('screen-login');
        setText('login-msg', '');
      }
    });
  </script>
</body>
</html>
