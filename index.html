<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Audio</title>
  <style>
    body { font-family: Georgia, serif; text-align: center; padding: 40px 20px; background: #fff; }
    h2 { font-size: 1.2rem; margin-bottom: 30px; }
    button {
      display: block; width: 100%; max-width: 300px; margin: 10px auto;
      padding: 16px; font-size: 1rem; font-weight: bold;
      border: 2px solid #000; border-radius: 8px;
      background: #000; color: #fff; cursor: pointer;
    }
    button.stop { background: #fff; color: #000; }
    #status {
      margin-top: 20px; font-size: 0.85rem; color: #555;
      min-height: 2em;
    }
  </style>
</head>
<body>
  <h2>🔊 Test Audio Kindle</h2>
  <button id="btn-play" onclick="playAudio()">▶ Play</button>
  <button id="btn-stop" class="stop" onclick="stopAudio()">■ Stop</button>
  <div id="status">Sedia.</div>

  <script>
    var audio = null;

    function playAudio() {
      try {
        if (audio) { audio.pause(); audio = null; }
        audio = new Audio('https://raw.githubusercontent.com/Sayaz06/Releasestress/main/SuperSayaz.mp3');
        audio.onplay = function() { document.getElementById('status').textContent = '▶ Sedang main...'; };
        audio.onended = function() { document.getElementById('status').textContent = '✓ Selesai.'; };
        audio.onerror = function(e) { document.getElementById('status').textContent = '✗ Gagal: ' + (e.message || 'format tidak disokong atau tiada audio output.'); };
        audio.play().then(function() {
          document.getElementById('status').textContent = '▶ Sedang main...';
        }).catch(function(e) {
          document.getElementById('status').textContent = '✗ Gagal: ' + e.message;
        });
      } catch(e) {
        document.getElementById('status').textContent = '✗ Error: ' + e.message;
      }
    }

    function stopAudio() {
      if (audio) { audio.pause(); audio.currentTime = 0; audio = null; }
      document.getElementById('status').textContent = '■ Dihentikan.';
    }
  </script>
</body>
</html>
