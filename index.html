<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Istigfar Kindle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      margin: 8px 0 12px;
      letter-spacing: 0.04em;
    }
    .sub {
      text-align: center;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 12px;
      margin: 10px 0;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      border-radius: 6px;
    }
    .btn:active { background: #000; color: #fff; }
    .btn-primary { background: #000; color: #fff; }
    .btn-primary:active { background: #333; }
    .btn-sm {
      padding: 10px 8px;
      font-size: 0.95rem;
      width: auto;
      display: inline-block;
      margin: 4px;
    }
    .btn-sm.on {
      background: #000;
      color: #fff;
    }

    .pin-input {
      width: 100%;
      padding: 16px;
      font-size: 1.6rem;
      text-align: center;
      letter-spacing: 0.35em;
      border: 2px solid #000;
      border-radius: 8px;
      background: #fff;
      color: #000;
      outline: none;
      margin: 12px 0;
      font-family: monospace;
    }

    .counter-box {
      border: 3px solid #000;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      margin: 14px 0;
      min-height: 160px;
    }
    .mode-label {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .phase {
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .big-text {
      font-size: 1.5rem;
      line-height: 1.4;
      font-weight: bold;
      word-break: break-word;
      margin: 10px 0;
      white-space: pre-wrap;
    }
    .progress {
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .meta {
      font-size: 0.8rem;
      color: #444;
      margin-top: 6px;
    }
    .side-label {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }

    .status-bar {
      border: 1px solid #000;
      padding: 8px;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 12px;
      background: #f5f5f5;
    }
    .row {
      text-align: center;
      margin: 8px 0;
    }

    #login-msg, #err-msg {
      text-align: center;
      font-size: 0.9rem;
      margin: 12px 0;
      min-height: 1.2em;
    }
    .error { color: #800; font-weight: bold; }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #666;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div id="screen-login" class="screen active">
    <h1>Istigfar Kindle</h1>
    <div class="sub">Countdown Bahasa & Fakta<br>Login dengan PIN Admin</div>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button id="btn-login" class="btn btn-primary">Masuk</button>
    <div id="login-msg"></div>
    <div class="footer">Guna PIN yang sama seperti app phone</div>
  </div>

  <div id="screen-main" class="screen">
    <div class="status-bar" id="status-bar">Menyambung...</div>

    <div class="counter-box">
      <div class="mode-label" id="mode-label">—</div>
      <div class="phase" id="phase-label">—</div>
      <div class="side-label" id="side-label">MUKA DEPAN</div>
      <div class="big-text" id="main-text">Belum ada sesi aktif</div>
      <div class="progress" id="progress-label"></div>
      <div class="meta" id="meta-label"></div>
    </div>

    <button id="btn-next" class="btn btn-primary">SETERUSNYA →</button>

    <div class="row">
      <button id="btn-flip" class="btn btn-sm">Flip</button>
      <button id="btn-tips" class="btn btn-sm">Tips</button>
    </div>

    <div class="row">
      <button id="btn-mode-bahasa" class="btn btn-sm">Bahasa</button>
      <button id="btn-mode-fakta" class="btn btn-sm">Fakta</button>
    </div>

    <div class="row">
      <button id="btn-enter-sr" class="btn btn-sm">Masuk SR</button>
      <button id="btn-refresh" class="btn btn-sm">Refresh</button>
      <button id="btn-logout" class="btn btn-sm">Logout</button>
    </div>

    <div id="err-msg" class="error"></div>
    <div class="footer">Flip = muka / maksud · Tips = tips sebutan</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAGLX_xxH_dQ06epX4XCXtuSHN0DwZFMjA",
      authDomain: "stress-auti-action.firebaseapp.com",
      projectId: "stress-auti-action",
      storageBucket: "stress-auti-action.firebasestorage.app",
      messagingSenderId: "792580618622",
      appId: "1:792580618622:web:f0efb1d630e795584d5b2f",
      measurementId: "G-JH11TRZLGF"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.firestore();

    // Email admin yang diguna untuk PIN (sama seperti phone)
    var ADMIN_EMAIL = 'adha86614@gmail.com';

    var currentUser = null;
    var unsubSession = null;
    var sessionData = null;
    var isFlipped = false;
    var showTips = false;

    function showScreen(id) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) {
        screens[i].className = 'screen';
      }
      var el = document.getElementById(id);
      if (el) el.className = 'screen active';
    }

    function setText(id, txt) {
      var el = document.getElementById(id);
      if (el) el.textContent = txt || '';
    }

    function showErr(msg) {
      setText('err-msg', msg || '');
    }

    function updateDisplay() {
      if (!sessionData) {
        setText('main-text', 'Belum ada sesi aktif');
        setText('side-label', '');
        return;
      }

      var front = sessionData.text || sessionData.title || '(kosong)';
      var back = sessionData.translation || '';
      var tips = sessionData.tips || '';

      if (showTips) {
        setText('side-label', 'TIPS SEBUTAN');
        setText('main-text', tips ? tips : '(Tiada tips untuk kad ini)');
        document.getElementById('btn-tips').className = 'btn btn-sm on';
        document.getElementById('btn-flip').className = 'btn btn-sm';
      } else if (isFlipped) {
        setText('side-label', 'MUKA BELAKANG');
        setText('main-text', back ? back : '(Tiada terjemahan)');
        document.getElementById('btn-flip').className = 'btn btn-sm on';
        document.getElementById('btn-tips').className = 'btn btn-sm';
      } else {
        setText('side-label', 'MUKA DEPAN');
        setText('main-text', front);
        document.getElementById('btn-flip').className = 'btn btn-sm';
        document.getElementById('btn-tips').className = 'btn btn-sm';
      }
    }

    function renderSession(data) {
      sessionData = data || null;
      isFlipped = false;
      showTips = false;

      if (!data) {
        setText('status-bar', 'Tiada sesi aktif — buka countdown di phone');
        setText('mode-label', '—');
        setText('phase-label', '—');
        setText('main-text', 'Belum ada sesi aktif');
        setText('side-label', '');
        setText('progress-label', '');
        setText('meta-label', '');
        return;
      }

      var mode = data.mode || '—';
      var isSR = !!data.isSR;
      var phase = data.phase || '';
      var progress = data.progress || '';
      var meta = data.meta || '';

      setText('status-bar', 'Sync OK · ' + (data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : ''));
      setText('mode-label', (isSR ? 'SR · ' : '') + (mode === 'bahasa' ? 'LACI BAHASA' : mode === 'fakta' ? 'LACI FAKTA' : String(mode).toUpperCase()));
      setText('phase-label', phase);
      setText('progress-label', progress);
      setText('meta-label', meta);
      updateDisplay();
    }

    function startSessionListener(uid) {
      if (unsubSession) unsubSession();
      unsubSession = db.collection('users').doc(uid).collection('kindle_session').doc('current')
        .onSnapshot(function(snap) {
          if (snap.exists) {
            renderSession(snap.data());
          } else {
            renderSession(null);
          }
        }, function(err) {
          setText('status-bar', 'Error sync: ' + err.message);
          showErr(err.message);
        });
    }

    function sendCommand(cmd, extra) {
      if (!currentUser) return;
      var payload = {
        command: cmd,
        ts: Date.now(),
        from: 'kindle'
      };
      if (extra) {
        for (var k in extra) {
          if (Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k];
        }
      }
      db.collection('users').doc(currentUser.uid).collection('kindle_session').doc('command')
        .set(payload)
        .then(function() {
          showErr('');
          setText('status-bar', 'Command dihantar: ' + cmd);
        })
        .catch(function(e) {
          showErr('Gagal hantar: ' + e.message);
        });
    }

    function cubaLoginPin() {
      var pin = document.getElementById('pin-input').value.trim();
      if (!pin || !/^\d{4,6}$/.test(pin)) {
        setText('login-msg', 'PIN mesti 4-6 digit angka');
        return;
      }
      setText('login-msg', 'Mengesahkan...');
      document.getElementById('btn-login').disabled = true;

      auth.signInWithEmailAndPassword(ADMIN_EMAIL, pin)
        .then(function() {
          document.getElementById('pin-input').value = '';
          setText('login-msg', '');
        })
        .catch(function(e) {
          document.getElementById('btn-login').disabled = false;
          if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
            setText('login-msg', 'PIN salah. Cuba lagi.');
          } else if (e.code === 'auth/user-not-found') {
            setText('login-msg', 'PIN belum ditetapkan. Setup di phone dulu.');
          } else {
            setText('login-msg', 'Ralat: ' + (e.message || e.code));
          }
        });
    }

    document.getElementById('btn-login').onclick = cubaLoginPin;
    document.getElementById('pin-input').onkeydown = function(e) {
      if (e.key === 'Enter') cubaLoginPin();
    };

    document.getElementById('btn-logout').onclick = function() {
      if (unsubSession) unsubSession();
      auth.signOut();
    };

    document.getElementById('btn-next').onclick = function() {
      isFlipped = false;
      showTips = false;
      sendCommand('next');
    };

    document.getElementById('btn-flip').onclick = function() {
      if (!sessionData) return;
      showTips = false;
      isFlipped = !isFlipped;
      updateDisplay();
    };

    document.getElementById('btn-tips').onclick = function() {
      if (!sessionData) return;
      isFlipped = false;
      showTips = !showTips;
      updateDisplay();
    };

    document.getElementById('btn-enter-sr').onclick = function() {
      sendCommand('enterSR');
    };

    document.getElementById('btn-mode-bahasa').onclick = function() {
      sendCommand('switchMode', { mode: 'bahasa' });
    };

    document.getElementById('btn-mode-fakta').onclick = function() {
      sendCommand('switchMode', { mode: 'fakta' });
    };

    document.getElementById('btn-refresh').onclick = function() {
      if (currentUser) startSessionListener(currentUser.uid);
      setText('status-bar', 'Refresh...');
    };

    auth.onAuthStateChanged(function(user) {
      currentUser = user;
      document.getElementById('btn-login').disabled = false;
      if (user) {
        showScreen('screen-main');
        setText('status-bar', 'Logged in');
        startSessionListener(user.uid);
      } else {
        showScreen('screen-login');
        setText('login-msg', '');
      }
    });
  </script>
</body>
</html>
