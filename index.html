<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <title>Kindle App — Fakta/Bahasa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: 4px 6px;
      max-width: 420px;
      margin: 0 auto;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    h1 { font-size: 1.15rem; text-align: center; margin: 4px 0 6px; }
    .sub { text-align: center; font-size: 0.78rem; color: #333; margin-bottom: 8px; }

    .btn {
      display: block; width: 100%; padding: 11px 8px; margin: 4px 0;
      font-size: 1.05rem; font-weight: bold; text-align: center;
      border: 2px solid #000; background: #fff; color: #000;
      cursor: pointer; border-radius: 6px;
    }
    .btn:active { background: #000; color: #fff; }
    .btn-primary { background: #000; color: #fff; }
    .btn-primary:active { background: #333; }
    .btn-primary:disabled, .btn-primary[disabled] {
      background: #999; border-color: #999; color: #fff; cursor: not-allowed;
    }
    .btn:disabled, .btn[disabled] {
      background: #eee; border-color: #aaa; color: #aaa; cursor: not-allowed;
    }    

    .btn-row {
      display: table;
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px 0;
      margin: 3px 0 0;
    }
    .btn-row .btn-sm {
      display: table-cell;
      width: 25%;
      padding: 16px 2px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      border-radius: 6px;
      vertical-align: middle;
    }
    .btn-row .btn-sm.on { background: #000; color: #fff; }
    .btn-row .btn-sm:active { background: #000; color: #fff; }
    .btn-row .btn-menu {
      background: #ddd;
      color: #000;
    }   

    .pin-input {
      width: 100%; padding: 12px; font-size: 1.4rem; text-align: center;
      letter-spacing: 0.3em; border: 2px solid #000; border-radius: 8px;
      background: #fff; color: #000; outline: none; margin: 8px 0;
      font-family: monospace;
    }

    .status-bar {
      border: 1px solid #000; padding: 3px 6px; font-size: 0.68rem;
      text-align: center; margin-bottom: 3px; background: #f5f5f5;
    }
    .counter-box {
      border: 3px solid #000; border-radius: 10px; padding: 6px 8px;
      text-align: center; margin: 3px 0;
    }
    .mode-label { font-size: 0.65rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 1px; }
    .side-label { font-size: 0.65rem; font-weight: bold; margin-bottom: 1px; }
    .big-text {
      font-size: 1.25rem; line-height: 1.3; font-weight: bold;
      word-break: break-word; margin: 3px 0; white-space: pre-wrap;
      text-align: center;
    }
    .big-text.tips-mode {
      font-size: 0.92rem;
      line-height: 1.4;
      font-weight: normal;
      text-align: left;
    }

    /* ── TIPS CLOSE BUTTON ── */
    #tips-close-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 888;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    #tips-close-btn.visible { display: flex; }
    .big-text.long-text {
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .card-img {
      display: block; max-width: 100%;
      margin: 2px auto; border: 1px solid #000;
      /* max-height dikawal JS autoFit */
    }
    .card-img-placeholder {
      display: none;
      width: 100%;
      margin: 2px auto;
      border: 1px dashed #aaa;
      background: #f5f5f5;
      box-sizing: border-box;
    }
    .progress { font-size: 0.72rem; margin-top: 1px; }
    .meta { font-size: 0.65rem; color: #444; margin-top: 1px; }

    .msg { text-align: center; font-size: 0.75rem; margin: 2px 0; min-height: 0.9em; }
    .error { color: #800; font-weight: bold; }
    .footer { text-align: center; font-size: 0.65rem; color: #666; margin-top: 8px; }

    /* ── CHAMPION CONFIRM OVERLAY ── */
    .champ-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 999;
      align-items: center; justify-content: center;
    }
    .champ-overlay.active { display: flex; }
    .champ-overlay-box {
      background: #fff; border: 3px solid #000; border-radius: 12px;
      padding: 18px 16px; max-width: 340px; width: 90%; text-align: center;
    }
    .champ-overlay-title {
      font-size: 0.72rem; font-weight: bold; letter-spacing: 0.05em;
      text-transform: uppercase; color: #555; margin-bottom: 6px;
    }
    .champ-overlay-name {
      font-size: 1.05rem; font-weight: bold; margin-bottom: 4px;
    }
    .champ-overlay-q {
      font-size: 0.88rem; margin-bottom: 14px; color: #333;
    }
    .champ-overlay-btn-yes {
      display: block; width: 100%; padding: 11px; margin-bottom: 24px;
      font-size: 0.95rem; font-weight: bold; background: #000; color: #fff;
      border: 2px solid #000; border-radius: 8px; cursor: pointer;
    }
    .champ-overlay-btn-skip {
      display: block; width: 100%; padding: 11px; margin-top: 24px;
      font-size: 0.82rem; font-weight: bold; background: #fff; color: #000;
      border: 2px solid #aaa; border-radius: 8px; cursor: pointer;
      line-height: 1.3;
    }

    /* ── GO-TICK ── */
    .gt-screen { display: none; }
    .gt-screen.active { display: block; }
    .gt-tajuk-list { margin: 4px 0; }
    .gt-tajuk-item {
      display: block; width: 100%; padding: 11px 8px; margin: 4px 0;
      font-size: 1.0rem; font-weight: bold; text-align: left;
      border: 2px solid #000; background: #fff; color: #000;
      cursor: pointer; border-radius: 6px;
    }
    .gt-tajuk-item.emergency {
      border-color: #800; color: #800; background: #fff8f8;
    }
    .gt-tajuk-item:active { background: #000; color: #fff; }
    .gt-tajuk-item.emergency:active { background: #800; color: #fff; }
    .gt-tajuk-progress {
      font-size: 0.7rem; font-weight: normal; color: #555; margin-left: 6px;
    }
    .gt-tajuk-progress.done { color: #080; font-weight: bold; }
    .gt-checklist { margin: 4px 0; }
    .gt-group-label {
      font-size: 0.7rem; font-weight: bold; text-transform: uppercase;
      letter-spacing: 0.05em; color: #555; margin: 8px 0 3px;
      border-bottom: 1px solid #ccc; padding-bottom: 2px;
    }
    .gt-item-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 4px; border-bottom: 1px solid #eee; cursor: pointer;
    }
    .gt-item-row:active { background: #f0f0f0; }
    .gt-checkbox {
      width: 22px; height: 22px; border: 2px solid #000;
      border-radius: 4px; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; font-size: 1rem;
    }
    .gt-checkbox.ticked { background: #000; color: #fff; }
    .gt-item-name {
      font-size: 0.95rem; flex: 1;
    }
    .gt-item-name.ticked { text-decoration: line-through; color: #888; }
    .gt-status-bar {
      border: 1px solid #000; padding: 3px 6px; font-size: 0.68rem;
      text-align: center; margin-bottom: 3px; background: #f5f5f5;
    }
    .gt-emergency-badge {
      font-size: 0.65rem; background: #800; color: #fff;
      padding: 1px 6px; border-radius: 4px; margin-left: 4px;
    }    
  </style>
</head>

    function showScreen(id) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) screens[i].className = 'screen';
      var el = document.getElementById(id);
      if (el) el.className = 'screen active';
    }
    function setText(id, t) {
      var el = document.getElementById(id);
      if (el) el.textContent = t || '';
    }
    function getSRInterval(fasaIndex) {
      if (fasaIndex < SR_INTERVALS.length) return SR_INTERVALS[fasaIndex];
      return (8 + (fasaIndex - SR_INTERVALS.length)) * 24 * 60 * 60 * 1000;
    }
    function getLabelFasaSR(fasaIndex) {
      var labels = [
        'Fasa 1 — +20 minit', 'Fasa 2 — +2 jam', 'Fasa 3 — +4 jam', 'Fasa 4 — +6 jam',
        'Fasa 5 — +2 hari', 'Fasa 6 — +4 hari', 'Fasa 7 — +6 hari', 'Fasa 8 — +7 hari'
      ];
      if (fasaIndex < labels.length) return labels[fasaIndex];
      return 'Fasa ' + (fasaIndex + 1) + ' — +' + (8 + (fasaIndex - 8)) + ' hari';
    }

    /** Auto-saiz gambar: ambil saki-baki skrin, kecilkan bila ayat panjang */
    function autoFitImage(textLen) {
      var img = document.getElementById('card-img');
      if (!img || img.style.display === 'none') return null;

      var vh = window.innerHeight || 600;
      // Rizab: status(~28) + labels(~36) + progress/meta(~36) + SETERUSNYA(~48) + btn-row(~44) + padding(~24)
      var reserved = 220;
      // Anggaran ketinggian teks (~18px per 28 aksara pada width ~380)
      var textH = Math.ceil((textLen || 40) / 28) * 22;
      if (textH < 30) textH = 30;
      if (textH > 160) textH = 160;

      var maxImg = vh - reserved - textH;
      if (maxImg < 80) maxImg = 80;
      if (maxImg > 320) maxImg = 320;

      img.style.maxHeight = maxImg + 'px';
      return maxImg;
    }

    function cardsFromBahasaDrawer(d, isSR) {
      var out = [];
      var title = d.title || 'Laci';
      var tips0 = (d.tipsFasa0 || '').trim();
      var tips12 = (d.tips || '').trim();
      var img = d.imageUrl || '';
      var r, i;

      // Fasa Gambar × 10 (hanya jika ada gambar)
      // r=0..4 → G1 (5 kad) | r=5..9 → G2 (5 kad)
      var img2 = d.imageUrl11 || '';
      if (img) {
        for (r = 0; r < 10; r++) {
          var isG2 = (r >= 5); // kad 6-10 guna G2
          var imgFasa, frontFasa, gambarSlot;
          if (!isG2) {
            // G1
            imgFasa = img;
            frontFasa = 'Hafal gambar ini terlebih dahulu.\nTutup mata dan bayangkan imej tersebut.\nBuka mata semula, kemudian tekan SETERUSNYA.\nUlang langkah ini sebanyak 5 kali.';
            gambarSlot = 1;
          } else if (img2) {
            // G2 ada
            imgFasa = img2;
            frontFasa = 'Hafal gambar ini terlebih dahulu.\nTutup mata dan bayangkan imej tersebut.\nBuka mata semula, kemudian tekan SETERUSNYA.\nUlang langkah ini sebanyak 5 kali.';
            gambarSlot = 2;
          } else {
            // G2 tiada — guna G1 sementara
            imgFasa = img;
            frontFasa = '📷 Gambar 1 digunakan sementara waktu\n📷 Gambar 2 belum tersedia untuk digunakan.\nSila tambah melalui telefon anda.\nTekan SETERUSNYA untuk meneruskan.';
            gambarSlot = 2;
          }
          out.push({
            front: frontFasa,
            back: '', tips: '', imageUrl: imgFasa,
            title: title, drawerId: d.id, isF0: false, isGambar: true, isTamat: false, isSR: !!isSR, fasa: -1,
            gambarSlot: gambarSlot
          });
        }
      }

      // F0 × 5
      for (r = 0; r < 5; r++) {
        out.push({
          front: title, back: '', tips: tips0, imageUrl: img,
          title: title, drawerId: d.id, isF0: true, isTamat: false, isSR: !!isSR, fasa: 0
        });
      }

      var notes = (d.notes || '').trim();
      var noteCards = [];
      if (notes) {
        var lines = notes.split('\n');
        for (i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          var parts = line.split('=');
          noteCards.push({
            front: parts[0].trim(),
            back: parts.length > 1 ? parts.slice(1).join('=').trim() : '',
            tips: tips12, imageUrl: img,
            title: title, drawerId: d.id, isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      }

      // F1 × 5 (setiap baris notes)
      for (r = 0; r < 5; r++) {
        for (i = 0; i < noteCards.length; i++) {
          var c1 = {};
          for (var k1 in noteCards[i]) c1[k1] = noteCards[i][k1];
          c1.fasa = 1;
          out.push(c1);
        }
      }

      // F2 × 5 (setiap baris notes)
      for (r = 0; r < 5; r++) {
        for (i = 0; i < noteCards.length; i++) {
          var c2 = {};
          for (var k2 in noteCards[i]) c2[k2] = noteCards[i][k2];
          c2.fasa = 2;
          out.push(c2);
        }
      }

      out.push({
        front: isSR ? ('SR selesai — ' + getLabelFasaSR((srLaciSemasa && srLaciSemasa.fasaSemasa) || 0)) : 'Laci Tamat. Tekan SETERUSNYA.',
        back: '', tips: '', imageUrl: '',
        title: title, drawerId: d.id, isF0: false, isTamat: true, isSR: !!isSR
      });
      return out;
    }
    
    function formatKtoBaris(text) {
      if (!text) return '';
      return text
        .replace(/\s*K(\d+)\s*:\s*/gi, '\n$1 : ')
        .replace(/\s+k(\d+)\s*/gi, '\n$1 : ')
        .replace(/^\n+/, '')
        .trim();
    }

    function cardsFromFaktaDrawer(d, isSR) {
      var out = [];
      var tips = (d.tipsFakta || d.tips || '').trim();
      var title = d.title || 'Laci';
      var itemCards = [];
      var i, r;

      if (d.items && d.items.length) {
        for (i = 0; i < d.items.length; i++) {
          var it = d.items[i];
          var ayat = (it.ayat || it.text || '').trim();
          if (!ayat) continue;
          var eq = ayat.indexOf('=');
          var depan = eq !== -1 ? ayat.slice(0, eq).trim() : ayat;
          var belakang = eq !== -1 ? ayat.slice(eq + 1).trim() : (it.maksud || '');
          itemCards.push({
            front: depan,
            back: formatKtoBaris(belakang),
            tips: tips,
            imageUrl: it.imageUrl || d.imageUrl || '',
            title: title, drawerId: d.id,
            isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      } else if (d.notes) {
        var lines = d.notes.split('\n');
        for (var j = 0; j < lines.length; j++) {
          var line = lines[j].trim();
          if (!line) continue;
          var eq2 = line.indexOf('=');
          var depan2 = eq2 !== -1 ? line.slice(0, eq2).trim() : line;
          var belakang2 = eq2 !== -1 ? line.slice(eq2 + 1).trim() : '';
          itemCards.push({
            front: depan2,
            back: formatKtoBaris(belakang2),
            tips: tips,
            imageUrl: d.imageUrl || '',
            title: title, drawerId: d.id,
            isF0: false, isTamat: false, isSR: !!isSR
          });
        }
      }

      // Fakta: setiap baris ada Fasa Gambar + F1×5 dan F2×5 berasingan
      // Aliran: [Gambar×10] → F1(1/5→5/5) → [JQ Motivasi] → F2(1/5→5/5) → daftar SR → baris seterusnya
      for (i = 0; i < itemCards.length; i++) {
        // Fasa Gambar × 5 (hanya jika ada gambar pada baris ini)
        var barisImg = itemCards[i].imageUrl || '';
        var barisImg2 = (d.items && d.items[i] && d.items[i].imageUrl11) ? d.items[i].imageUrl11 : '';
        if (barisImg) {
          for (r = 0; r < 10; r++) {
            var cgIsG2 = (r >= 5); // kad 6-10 guna G2
            var cgImg, cgFront, cgSlot;
            if (!cgIsG2) {
              // G1
              cgImg = barisImg;
              cgFront = 'Hafal gambar ini terlebih dahulu.\nTutup mata dan bayangkan imej tersebut.\nBuka mata semula, kemudian tekan SETERUSNYA.\nUlang langkah ini sebanyak 5 kali.';
              cgSlot = 1;
            } else if (barisImg2) {
              // G2 ada
              cgImg = barisImg2;
              cgFront = 'Hafal gambar ini terlebih dahulu.\nTutup mata dan bayangkan imej tersebut.\nBuka mata semula, kemudian tekan SETERUSNYA.\nUlang langkah ini sebanyak 5 kali.';
              cgSlot = 2;
            } else {
              // G2 tiada — guna G1 sementara
              cgImg = barisImg;
              cgFront = '📷 Gambar 1 digunakan sementara waktu\n📷 Gambar 2 belum tersedia untuk digunakan.\nSila tambah melalui telefon anda.\nTekan SETERUSNYA untuk meneruskan.';
              cgSlot = 2;
            }
            var cg = {};
            for (var kg in itemCards[i]) cg[kg] = itemCards[i][kg];
            cg.itemIndex = i;
            cg.fasa = -1;
            cg.isGambar = true;
            cg.isLastOfBaris = false;
            cg.isEndF1 = false;
            cg.imageUrl = cgImg;
            cg.front = cgFront;
            cg.back = '';
            cg.tips = '';
            cg.gambarSlot = cgSlot;
            out.push(cg);
          }
        }

        // F1 × 5
        for (r = 0; r < 5; r++) {
          var cf1 = {};
          for (var kf1 in itemCards[i]) cf1[kf1] = itemCards[i][kf1];
          cf1.itemIndex = i;
          cf1.fasa = 1;
          cf1.isLastOfBaris = false;
          cf1.isEndF1 = (r === 4); // habis F1 → trigger motivasi JQ
          out.push(cf1);
        }
        // F2 × 5
        for (r = 0; r < 5; r++) {
          var cf2 = {};
          for (var kf2 in itemCards[i]) cf2[kf2] = itemCards[i][kf2];
          cf2.itemIndex = i;
          cf2.fasa = 2;
          cf2.isLastOfBaris = (r === 4); // habis F2 → daftar SR
          cf2.isEndF1 = false;
          out.push(cf2);
        }
      }

      out.push({
        front: isSR ? ('SR Fakta selesai — ' + getLabelFasaSR((srLaciSemasa && srLaciSemasa.fasaSemasa) || 0)) : 'Laci Tamat. Tekan SETERUSNYA.',
        back: '', tips: '', imageUrl: '',
        title: title, drawerId: d.id, isF0: false, isTamat: true, isSR: !!isSR
      });
      return out;
    }

    function champGetNextItem() {
      // Cari sumber aktif yang ada data
      var activeSources = champSources.filter(function(s) { return champData[s] && champData[s].length > 0; });
      if (!activeSources.length) return null;

      // Pilih sumber ikut lastIdx — BELUM naikkan index dulu
      var activeLen = activeSources.length;
      var sourceKey = activeSources[champLastIdx % activeLen];

      var list = champData[sourceKey];
      var idx = champIdx[sourceKey] % list.length;
      var item = list[idx];

      // Bentuk output standard — sertakan _champSourceKey dan _champActiveLen terus dalam objek return
      // Index BELUM dinaikkan — hanya dinaikkan bila user sahkan (champCommitItem)
      if (sourceKey === 'motivasi' || sourceKey === 'perjanjian') {
        var adaFlip = item.text && item.text.includes('=');
        return {
          source: sourceKey,
          title: item.title || '',
          depan: adaFlip ? item.text.split('=')[0].trim() : (item.text || item.title || ''),
          belakang: adaFlip ? item.text.split('=').slice(1).join('=').trim() : '',
          adaFlip: !!adaFlip,
          _champSourceKey: sourceKey,
          _champActiveLen: activeLen
        };
      } else if (sourceKey === 'rutin') {
        return {
          source: 'rutin',
          title: item.title || '',
          depan: item.zikir || item.title || '',
          belakang: '',
          adaFlip: false,
          _champSourceKey: sourceKey,
          _champActiveLen: activeLen
        };
      } else if (sourceKey === 'supplement') {
        return {
          source: 'supplement',
          title: item.title || '',
          depan: (item.title || '') + (item.text ? '\n' + item.text : ''),
          belakang: '',
          adaFlip: false,
          _champSourceKey: sourceKey,
          _champActiveLen: activeLen
        };
      } else if (sourceKey === 'water') {
        return {
          source: 'water',
          title: '💧 Water Tracker',
          depan: (item.title || '💧 Air') + '\n' + (item.text || ''),
          belakang: '',
          adaFlip: false,
          waterItem: item,
          _champSourceKey: sourceKey,
          _champActiveLen: activeLen
        };
      }
      return null;
    }

    function champCommitItem(sourceKey, activeLen) {

      champIdx[sourceKey] = (champIdx[sourceKey] + 1) % champData[sourceKey].length;

    function daftarSRBaru(drawerId, modeName, itemIndex, barisText) {
      var drawer, srColl;
      if (modeName === 'fakta') {
        drawer = allDrawers.filter(function(d) { return d.id === drawerId; })[0];
        srColl = 'fakta_sr_queue';
      } else {
        drawer = allBahasaDrawers.filter(function(d) { return d.id === drawerId; })[0];
        srColl = 'bahasa_sr_queue';
      }
      if (!drawer) return Promise.resolve();

      // Fakta: satu baris = satu SR (docId = drawerId_b{itemIndex})
      var srDocId = drawerId;
      if (modeName === 'fakta' && itemIndex !== undefined && itemIndex !== null) {
        srDocId = drawerId + '_b' + itemIndex;
      }

      var ref = db.collection('users').doc(currentUser.uid).collection(srColl).doc(srDocId);
      return ref.get().then(function(snap) {
        if (snap.exists) return;
        var now = Date.now();
        var srData = {
          drawerId: drawerId,
          drawerTitle: drawer.title || '',
          hafalAt: now,
          fasaSemasa: 0,
          nextDueAt: now + SR_INTERVALS[0],
          sejarahFasa: [],
          createdAt: now,
          mode: modeName,
          srDocId: srDocId
        };
        if (modeName === 'bahasa') {
          srData.perkataanId = drawer.perkataanId || '';
          srData.jenisId = drawer.jenisId || '';
        } else {
          srData.topicId = drawer.topicId || '';
          if (itemIndex !== undefined && itemIndex !== null) {
            srData.itemIndex = itemIndex;
            srData.barisText = (barisText || '').slice(0, 200);
          }
          // Bina pdfKod sama seperti app backup
          var barisNo = (itemIndex !== null && itemIndex !== undefined) ? (itemIndex + 1) : 1;
          var pdfKod = null;
          var isSementara = false;
          var topic = allTopics.filter(function(t) { return t.id === drawer.topicId; })[0];
          var topicNama = (topic && topic.name) || 'Topik';
          var tajukSlide = drawer.title || 'Slide';
          if (drawer.pdfNombor && drawer.pdfTopik && drawer.pdfSubjek) {
            pdfKod = drawer.pdfSubjek + '/' + drawer.pdfTopik + '/' + tajukSlide + '-' + drawer.pdfNombor + '-B' + barisNo;
            isSementara = false;
          } else {
            var laciDalamTopik = allDrawers
              .filter(function(d) { return d.topicId === drawer.topicId; })
              .sort(function(a, b) { return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true }); });
            var idxSementara = -1;
            for (var si = 0; si < laciDalamTopik.length; si++) {
              if (laciDalamTopik[si].id === drawerId) { idxSementara = si; break; }
            }
            var subjek = allSubjects.filter(function(s) { return s.id === (topic && topic.subjectId); })[0];
            var subjekNama = (subjek && subjek.name) || topicNama;
            pdfKod = subjekNama + '/' + topicNama + '/' + tajukSlide + '-T' + (idxSementara + 1) + '-B' + barisNo;
            isSementara = true;
          }
          if (pdfKod) {
            srData.pdfKod = pdfKod;
            srData.isSementara = isSementara;
          }
        }
        return ref.set(srData);
      });
    }

          var activeDrawers = allDrawers
            .filter(function(d) { return d.topicId === topicId; })
            .sort(function(a, b) { return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true }); });
          cards = [];
          for (var j = 0; j < activeDrawers.length; j++) {
            var d = activeDrawers[j];
            var has = (d.items && d.items.length) || (d.notes || '').trim();
            if (has) cards = cards.concat(cardsFromFaktaDrawer(d, false));
          }
          cardIndex = 0;
          srModeAktif = false;
          srLaciSemasa = null;
          cb && cb(cards.length > 0);
        }).catch(function(e) {
          setText('play-err', 'Gagal load laci: ' + e.message);
          cb && cb(false);
        });
      return true; // async, guna cb
    }

    // Cache prefetch drawer terkini dari Firestore (background)
    var _prefetchCache = {}; // { drawerId: drawerObj }

    function prefetchDrawer(drawerId, colName) {
      if (!currentUser || !drawerId) return;
      db.collection('users').doc(currentUser.uid).collection(colName).doc(drawerId)
        .get().then(function(snap) {
          if (snap.exists) {
            var d = snap.data(); d.id = snap.id;
            _prefetchCache[drawerId] = d;
            // Kemas kini cache utama juga
            if (colName === 'bahasa_drawers') {
              var ib = -1;
              for (var i = 0; i < allBahasaDrawers.length; i++) {
                if (allBahasaDrawers[i].id === drawerId) { ib = i; break; }
              }
              if (ib !== -1) allBahasaDrawers[ib] = d; else allBahasaDrawers.push(d);
            } else {
              var ifd = -1;
              for (var j = 0; j < allDrawers.length; j++) {
                if (allDrawers[j].id === drawerId) { ifd = j; break; }
              }
              if (ifd !== -1) allDrawers[ifd] = d; else allDrawers.push(d);
            }
          }
        }).catch(function() {});
    }

    function getDrawerFresh(drawerId, colName) {
      // Guna cache prefetch kalau ada, otherwise ambil dari memory
      if (_prefetchCache[drawerId]) {
        var d = _prefetchCache[drawerId];
        delete _prefetchCache[drawerId];
        return Promise.resolve(d);
      }
      return db.collection('users').doc(currentUser.uid).collection(colName).doc(drawerId)
        .get().then(function(snap) {
          if (!snap.exists) return null;
          var d = snap.data(); d.id = snap.id;
          return d;
        });
    }

    function loadSRIntoCards(srData, modeName, cb) {
      var drawerId = srData.drawerId || srData.id;
      var colName = modeName === 'bahasa' ? 'bahasa_drawers' : 'drawer';
      delete _prefetchCache[drawerId]; // buang cache lama, paksa fetch semula
      db.collection('users').doc(currentUser.uid).collection(colName).doc(drawerId)
        .get().then(function(snap) {
          if (!snap.exists) { cb && cb(false); return; }
          var drawer = snap.data(); drawer.id = snap.id;
          if (modeName === 'bahasa') {
            var ib = -1;
            for (var i = 0; i < allBahasaDrawers.length; i++) {
              if (allBahasaDrawers[i].id === drawerId) { ib = i; break; }
            }
            if (ib !== -1) allBahasaDrawers[ib] = drawer; else allBahasaDrawers.push(drawer);
            cards = cardsFromBahasaDrawer(drawer, true);
          } else {
            var ifd = -1;
            for (var j = 0; j < allDrawers.length; j++) {
              if (allDrawers[j].id === drawerId) { ifd = j; break; }
            }
            if (ifd !== -1) allDrawers[ifd] = drawer; else allDrawers.push(drawer);
            cards = cardsFromFaktaDrawer(drawer, true);
          }
          cardIndex = 0;
          srModeAktif = true;
          srLaciSemasa = srData;
          cb && cb(true);
        }).catch(function() { cb && cb(false); });
    }

    function startBahasa() {
      if (isLoading) return;
      isLoading = true;
      _prefetchCache = {};
      mode = 'bahasa';
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      _srAdaCache = false; // reset cache SR
      setText('play-status', 'Memuat Bahasa + SR...');
      setText('play-err', '');
      showScreen('screen-play');

      loadCollections(function() {
        loadSROverdue('bahasa_sr_queue').then(function(overdue) {
          // Ambil SATU SR sahaja
          srQueue = overdue;
          if (srQueue.length) {
            srLaciSemasa = srQueue.shift();
            srModeAktif = true;
            _srAdaCache = true;
            // Prefetch laci BIASA pertama (sebab selepas SR wajib laci biasa)
            _prefetchLaciBiasaBahasa();
            loadSRIntoCards(srLaciSemasa, 'bahasa', function(ok) {
              if (ok) {
                var srDrawer = allBahasaDrawers.filter(function(d) { return d.id === srLaciSemasa.drawerId; })[0];
                if (srDrawer) {
                  var srIssues = checkTipsBlock(srDrawer);
                  if (srIssues.length) {
                    isLoading = false;
                    setText('play-status', 'SR BAHASA · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
                    renderBlockCard(srDrawer.title || '', srIssues);
                    return;
                  }
                }
                setText('play-status', 'SR BAHASA · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
                isLoading = false; clearBlockCard(); renderCard(); return;
              }
              // SR drawer tiada — reset dan terus ke laci biasa
              srModeAktif = false; srLaciSemasa = null; _srAdaCache = false;
              _mulaLaciBiasaBahasa();
            });
            return;
          }
          // Tiada SR — terus ke laci biasa
          _srAdaCache = false;
          _mulaLaciBiasaBahasa();
        }).catch(function(e) {
          isLoading = false;
          srModeAktif = false; srLaciSemasa = null;
          setText('play-err', e.message);
          rebuildBahasaCards(function() { renderCard(); });
        });

        function _mulaLaciBiasaBahasa() {
          rebuildBahasaCards(function(ok) {
            if (ok) {
              setText('play-status', 'BAHASA · ' + (activePerkataan.name || ''));
              var firstCard = cards[0];
              var firstDrawerId = firstCard ? firstCard.drawerId : null;
              var firstDrawer = firstDrawerId
                ? allBahasaDrawers.filter(function(d) { return d.id === firstDrawerId; })[0]
                : null;
              // Prefetch laci ke-2
              var secondDrawerId = null;
              for (var si = 0; si < cards.length; si++) {
                if (cards[si].drawerId && cards[si].drawerId !== firstDrawerId) {
                  secondDrawerId = cards[si].drawerId; break;
                }
              }
              if (secondDrawerId) prefetchDrawer(secondDrawerId, 'bahasa_drawers');
              if (firstDrawer) {
                var firstIssues = checkTipsBlock(firstDrawer);
                if (firstIssues.length) {
                  isLoading = false;
                  renderBlockCard(firstDrawer.title || '', firstIssues);
                  return;
                }
              }
            }
            isLoading = false; clearBlockCard(); renderCard();
          });
        }
      });
    }

    // Helper: prefetch laci biasa bahasa pertama (untuk guna selepas SR)
    function _prefetchLaciBiasaBahasa() {
      // Cuba guna activePerkataan dulu, kalau null cari dari allBahasaPerkataan
      var perk = activePerkataan;
      if (!perk) {
        for (var i = 0; i < allBahasaPerkataan.length; i++) {
          if (allBahasaPerkataan[i].isActive) { perk = allBahasaPerkataan[i]; break; }
        }
      }
      if (!perk) return;
      var perkId = perk.id;
      var sorted = allBahasaDrawers
        .filter(function(d) { return d.perkataanId === perkId; })
        .sort(function(a, b) { return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true }); });
      if (sorted.length) prefetchDrawer(sorted[0].id, 'bahasa_drawers');
    }

    function startFakta() {
      if (isLoading) return;
      isLoading = true;
      _prefetchCache = {};
      mode = 'fakta';
      isFlipped = false; showTips = false;
      jqModeSemasa = ''; jqKadSemasa = null;
      jqCardIndexSimpan = -1; jqPendingCardIndex = -1;
      _srAdaCache = false; // reset cache SR
      setText('play-status', 'Memuat Fakta + SR...');
      setText('play-err', '');
      showScreen('screen-play');

      loadCollections(function() {
        loadSROverdue('fakta_sr_queue').then(function(overdue) {
          // Ambil SATU SR sahaja — simpan baki dalam srQueue untuk check selepas laci biasa
          srQueue = overdue;
          if (srQueue.length) {
            srLaciSemasa = srQueue.shift();
            srModeAktif = true;
            _srAdaCache = true;
            // Prefetch laci BIASA pertama (sebab selepas SR wajib laci biasa)
            _prefetchLaciBiasaFakta();
            loadSRIntoCards(srLaciSemasa, 'fakta', function(ok) {
              if (ok) {
                setText('play-status', 'SR FAKTA · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0));
                isLoading = false; renderCard(); return;
              }
              // SR drawer tiada — reset dan terus ke laci biasa
              srModeAktif = false; srLaciSemasa = null; _srAdaCache = false;
              _mulaLaciBiasaFakta();
            });
            return;
          }
          // Tiada SR — terus ke laci biasa
          _srAdaCache = false;
          _mulaLaciBiasaFakta();
        }).catch(function(e) {
          isLoading = false;
          srModeAktif = false; srLaciSemasa = null;
          setText('play-err', e.message);
          rebuildFaktaCards(function() { renderCard(); });
        });

        function _mulaLaciBiasaFakta() {
          rebuildFaktaCards(function(ok) {
            if (ok) {
              setText('play-status', 'FAKTA · ' + (activeTopic.name || ''));
              // Prefetch laci ke-2 dalam topik
              var fd2 = null;
              var fd1 = cards.length ? cards[0].drawerId : null;
              for (var fi = 0; fi < cards.length; fi++) {
                if (cards[fi].drawerId && cards[fi].drawerId !== fd1) { fd2 = cards[fi].drawerId; break; }
              }
              if (fd2) prefetchDrawer(fd2, 'drawer');
            }
            isLoading = false; renderCard();
          });
        }
      });
    }

    // Helper: prefetch laci biasa fakta pertama (untuk guna selepas SR)
    function _prefetchLaciBiasaFakta() {
      // Cuba guna activeTopic dulu, kalau null cari dari allTopics
      var topic = activeTopic;
      if (!topic) {
        for (var i = 0; i < allTopics.length; i++) {
          if (allTopics[i].isActive) { topic = allTopics[i]; break; }
        }
      }
      if (!topic) return;
      var aktifId = topic.id;
      var sorted = allDrawers
        .filter(function(d) { return d.topicId === aktifId; })
        .sort(function(a, b) { return (a.title || '').localeCompare(b.title || '', undefined, { numeric: true }); });
      if (sorted.length) prefetchDrawer(sorted[0].id, 'drawer');
    }

    function setCardImage(url, useGambarPlaceholder) {
      var img = document.getElementById('card-img');
      var placeholder = document.getElementById('card-img-placeholder');
      if (!img) return;
      if (url) {
        img.src = url;
        img.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
        img.onerror = function() { img.style.display = 'none'; };
        img.onload = function() {
          autoFitImage((document.getElementById('main-text').textContent || '').length);
          // Ambil tinggi sebenar yang dirender pada skrin
          setTimeout(function() {
            if (img.offsetHeight > 0) lastGambarHeight = img.offsetHeight;
          }, 60);
        };
      } else if (useGambarPlaceholder) {
        img.removeAttribute('src');
        img.style.display = 'none';
        if (placeholder) {
          placeholder.style.display = 'block';
          placeholder.style.height = lastGambarHeight + 'px';
        }
      } else {
        img.removeAttribute('src');
        img.style.display = 'none';
        img.style.maxHeight = '';
        if (placeholder) placeholder.style.display = 'none';
      }
    }

    function checkTipsBlock(drawer) {
      // drawer = objek laci dari allBahasaDrawers
      var tipsF0 = (drawer.tipsFasa0 || '').trim();
      var tipsF12 = (drawer.tips || '').trim();
      var issues = [];
      if (!tipsF0) {
        issues.push('F0 Introductory Tips have not been configured. Please complete this field before proceeding.');
      }
      if (!tipsF12) {
        issues.push('F1 & F2 Practice Tips have not been configured. Please complete this field before proceeding.');
      }
      return issues; // kosong = tiada block
    }

    function renderBlockCard(drawerTitle, issues) {
      var mainEl = document.getElementById('main-text');
      setText('play-mode', 'TIPS VERIFICATION');
      setText('side-label', 'ACTION REQUIRED');
      setText('play-progress', '');
      setText('play-meta', '');
      setText('play-err', '');
      setCardImage('');

      // Bina drawer location dari activePerkataan & allJenisKata
      var perkataanNama = (activePerkataan && activePerkataan.name) ? activePerkataan.name : '—';
      var jenisId = (activePerkataan && activePerkataan.jenisId) ? activePerkataan.jenisId : '';
      var jenisObj = jenisId ? allJenisKata.filter(function(j) { return j.id === jenisId; })[0] : null;
      var jenisNama = (jenisObj && jenisObj.name) ? jenisObj.name : '—';

      var msg = '⚠️ The following issues have been detected and must be resolved before you may proceed:\n\n';
      msg += 'Drawer  : ' + drawerTitle + '\n';
      msg += 'Word    : ' + perkataanNama + '\n';
      msg += 'Category: ' + jenisNama + '\n';
      msg += '\n';
      for (var i = 0; i < issues.length; i++) {
        msg += (i + 1) + '. ' + issues[i] + '\n';
      }
      msg += '\nThis drawer has been blocked until all required tips are in place.';
      setText('main-text', msg);
      if (mainEl) mainEl.className = 'big-text tips-mode';

      // Disable button SETERUSNYA
      var btnNext = document.getElementById('btn-next');
      if (btnNext) {
        btnNext.disabled = true;
        btnNext.textContent = 'BLOCKED';
      }

      // Hint reload di play-err
      setText('play-err', 'Once the required tips have been added via your phone, please tap Reload to continue.');

    function clearBlockCard() {
      var btnNext = document.getElementById('btn-next');
      if (btnNext) {
        btnNext.disabled = false;
        btnNext.textContent = 'SETERUSNYA';
      }
    }
    
    function renderCard() {
      var mainEl = document.getElementById('main-text');
      if (!cards.length) {
        setText('main-text', 'Tiada kad');
        mainEl.className = 'big-text';
        setCardImage('');
        return;
      }
      if (cardIndex >= cards.length) {
        setText('main-text', 'Selesai');
        mainEl.className = 'big-text';
        setText('side-label', '');
        setText('play-progress', '');
        setCardImage('');
        return;
      }

      var c = cards[cardIndex];
      // F1 bahasa: tukar makna "depan/belakang" — maksud jadi default, perkataan jadi flip
      var isF1Bahasa = (mode === 'bahasa' && !c.isF0 && c.fasa === 1 && !c.isTamat);
      var fasaLabel = '';
      if (c.isTamat) fasaLabel = 'TAMAT';
      else if (c.isGambar) {
        var gambarBarisLabel = (mode === 'fakta' && c.itemIndex !== undefined && c.itemIndex !== null) ? ' · Baris ' + (c.itemIndex + 1) : '';
        fasaLabel = 'GAMBAR · ' + (c.title || '') + gambarBarisLabel;
      }        
      else if (mode === 'bahasa') {
        if (c.isF0 || c.fasa === 0) fasaLabel = 'F0 · Pengenalan';
        else if (c.fasa === 1) fasaLabel = 'F1 · Latihan';
        else if (c.fasa === 2) fasaLabel = 'F2 · Ulangan';
      } else {
        fasaLabel = c.title || '';
      }

      // Fakta: tunjuk F1/F2 dalam label
      if (mode === 'fakta' && !c.isTamat && !c.isF0 && !c.isGambar) {
        var barisLabel = (c.itemIndex !== undefined && c.itemIndex !== null) ? ' · Baris ' + (c.itemIndex + 1) : '';
        fasaLabel = (c.fasa === 1 ? 'F1' : 'F2') + ' · ' + (c.title || '') + barisLabel;
      }
      var label = (srModeAktif ? 'SR · ' : '') + fasaLabel;
      setText('play-mode', label);

      // Kira progress dalam fasa + laci semasa sahaja
      var fasaSemasa = c.isGambar ? -1 : (c.isF0 ? 0 : (c.fasa !== undefined ? c.fasa : -1));
      var fasaStart = cardIndex, fasaEnd = cardIndex;
      for (var pi = 0; pi < cards.length; pi++) {
        if (cards[pi].isTamat) continue;
        var pf = cards[pi].isGambar ? -1 : (cards[pi].isF0 ? 0 : (cards[pi].fasa !== undefined ? cards[pi].fasa : -1));
        var sameLaci = (cards[pi].drawerId === c.drawerId)
          && (mode !== 'fakta' || cards[pi].itemIndex === c.itemIndex);
        if (pf === fasaSemasa && sameLaci) {
          if (pi < fasaStart) fasaStart = pi;
          if (pi > fasaEnd) fasaEnd = pi;
        }
      }
      var fasaPos = cardIndex - fasaStart + 1;
      var fasaTotal = fasaEnd - fasaStart + 1;
      setText('play-progress', c.isTamat ? '' : (fasaPos + ' / ' + fasaTotal));

      setText('play-meta', '');

      var displayText = '';
      if (c.isGambar) {
        var slotLabel = c.gambarSlot === 2 ? 'HAFAL GAMBAR · G2' : 'HAFAL GAMBAR · G1';
        setText('side-label', c.imageUrl ? slotLabel : 'HAFAL GAMBAR · ' + (c.gambarSlot === 2 ? 'G2 Tiada' : 'G1'));
        displayText = c.front;
        setText('main-text', displayText);
        mainEl.className = 'big-text tips-mode';
        document.getElementById('btn-flip').className = 'btn-sm';
        document.getElementById('btn-tips').className = 'btn-sm';
        if (c.imageUrl) setCardImage(c.imageUrl, false);
        else setCardImage('', c.gambarSlot === 2);        
      } else if (showTips) {
        setText('side-label', c.isF0 ? 'TIPS F0' : 'TIPS F1&2');
        displayText = c.tips ? c.tips : '(Tiada tips)';
        setText('main-text', displayText);
        mainEl.className = 'big-text tips-mode';
        document.getElementById('btn-tips').className = 'btn-sm on';
        document.getElementById('btn-flip').className = 'btn-sm';
        setCardImage('');
        document.getElementById('tips-close-btn').classList.add('visible');
      } else if (isFlipped) {
        // F1 bahasa: flip → tunjuk perkataan (depan)
        var flipText = isF1Bahasa ? (c.front || '(kosong)') : (c.back || '(Tiada terjemahan)');
        var flipLabel = isF1Bahasa ? 'PERKATAAN' : 'MUKA BELAKANG';
        setText('side-label', flipLabel);
        displayText = flipText;
        setText('main-text', displayText);
        mainEl.className = displayText.length > 80 ? 'big-text long-text' : 'big-text';
        document.getElementById('btn-flip').className = 'btn-sm on';
        document.getElementById('btn-tips').className = 'btn-sm';
        if (c.imageUrl) setCardImage(c.imageUrl);
        else setCardImage('');
      } else {
        // F1 bahasa: default → tunjuk maksud (belakang)
        var defaultText = isF1Bahasa ? (c.back || '(Tiada maksud)') : (c.front || '(kosong)');
        var defaultLabel = isF1Bahasa ? 'MAKSUD' : 'MUKA DEPAN';
        setText('side-label', defaultLabel);
        displayText = defaultText;
        setText('main-text', displayText);
        mainEl.className = displayText.length > 80 ? 'big-text long-text' : 'big-text';
        document.getElementById('btn-flip').className = 'btn-sm';
        document.getElementById('btn-tips').className = 'btn-sm';
        if (c.imageUrl) setCardImage(c.imageUrl);
        else setCardImage('');
      }
      // Sembunyikan tips-close-btn kalau bukan dalam tips mode
      if (!showTips) {
        document.getElementById('tips-close-btn').classList.remove('visible');
      }

      // Auto-fit selepas render (image mungkin belum load)
      setTimeout(function() {
        autoFitImage(displayText.length);
      }, 50);
    }

    function findNextDrawerStart(fromIdx) {
      var i = fromIdx + 1;
      while (i < cards.length && !cards[i].isF0 && !cards[i].isGambar && !cards[i].isTamat) i++;
      if (i < cards.length && cards[i].isTamat) i++;
      return i;
    }

    function lompatPerkataanSeterusnya() {
      if (!activePerkataan) return Promise.resolve(false);
      var sorted = allBahasaPerkataan
        .filter(function(p) { return p.jenisId === activePerkataan.jenisId; })
        .sort(function(a, b) {
          return (a.name || '').localeCompare(b.name || '', undefined, { numeric: true });
        });
      var idx = -1;
      for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].id === activePerkataan.id) { idx = i; break; }
      }
      if (idx < 0 || idx >= sorted.length - 1) return Promise.resolve(false);

      var next = sorted[idx + 1];
      var batch = db.batch();
      var uid = currentUser.uid;
      for (var j = 0; j < allBahasaPerkataan.length; j++) {
        if (allBahasaPerkataan[j].isActive) {
          batch.update(db.collection('users').doc(uid).collection('bahasa_perkataan').doc(allBahasaPerkataan[j].id), { isActive: false });
          allBahasaPerkataan[j].isActive = false;
        }
      }
      batch.update(db.collection('users').doc(uid).collection('bahasa_perkataan').doc(next.id), { isActive: true, lastIndex: 0 });
      next.isActive = true;
      next.lastIndex = 0;

      return batch.commit().then(function() {
        activePerkataan = next;
        rebuildBahasaCards(function(ok) {
          setText('play-status', 'BAHASA · ' + (next.name || ''));
          if (jqAktif && jqMotivasiList.length) {
            tunjukMotivasiJQ(function() { renderCard(); });
          } else {
            renderCard();
          }
        });
        return true;
      }).catch(function() { return false; });
    }

    function afterTamat(c) {
      isBusy = true;
      setText('play-err', 'Menyimpan...');
      var drawerId = c.drawerId;
      var isSR = c.isSR || srModeAktif;
      var nextIdx = findNextDrawerStart(cardIndex);
      var isLast = nextIdx >= cards.length;
      var srCol = mode === 'fakta' ? 'fakta_sr_queue' : 'bahasa_sr_queue';

      // isTamat fakta: SR sudah didaftar per-baris; jangan daftar semula whole-laci
      var srId = (srLaciSemasa && (srLaciSemasa.srDocId || srLaciSemasa.id)) || drawerId;
      var p = isSR
        ? selesaiSRUlangan(srId, mode)
        : (mode === 'fakta' ? Promise.resolve() : daftarSRBaru(drawerId, mode));

      p.then(function() {
        if (isSR) {
          // ── SELEPAS SR: WAJIB ke laci biasa dulu ──
          srModeAktif = false;
          srLaciSemasa = null;

          // Reset lastIndex ke 0 supaya laci biasa mula dari gambar
          if (mode === 'bahasa' && activePerkataan) {
            activePerkataan.lastIndex = 0;
            db.collection('users').doc(currentUser.uid).collection('bahasa_perkataan').doc(activePerkataan.id)
              .update({ lastIndex: 0 }).catch(function() {});
          } else if (mode === 'fakta' && activeTopic) {
            activeTopic.lastIndex = 0;
            db.collection('users').doc(currentUser.uid).collection('topics').doc(activeTopic.id)
              .update({ lastIndex: 0 }).catch(function() {});
          }

          var _rebuildFn = mode === 'bahasa' ? rebuildBahasaCards : rebuildFaktaCards;
          _rebuildFn(function(ok) {
            if (!ok) { isBusy = false; setText('play-err', ''); return; }
            isFlipped = false; showTips = false;
            clearBlockCard();

            var _statusSR = mode === 'bahasa'
              ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
              : ('FAKTA · ' + ((activeTopic && activeTopic.name) || ''));
            setText('play-status', _statusSR);
            isBusy = false; setText('play-err', '');

            if (jqAktif && jqMotivasiList.length) {
              tunjukMotivasiJQ(function() {
                setText('play-status', _statusSR);
                // Block check bahasa selepas JQ
                if (mode === 'bahasa') {
                  var firstCard = cards[0];
                  var firstDrawerId = firstCard ? firstCard.drawerId : null;
                  var firstDrawerObj = firstDrawerId
                    ? allBahasaDrawers.filter(function(d) { return d.id === firstDrawerId; })[0]
                    : null;
                  if (firstDrawerObj) {
                    var blockIssuesSR = checkTipsBlock(firstDrawerObj);
                    if (blockIssuesSR.length) {
                      isBusy = true;
                      renderBlockCard(firstDrawerObj.title || '', blockIssuesSR);
                      isBusy = false;
                      return;
                    }
                  }
                }
                renderCard();
              });
            } else {
              // Block check bahasa (tiada JQ)
              if (mode === 'bahasa') {
                var firstCard = cards[0];
                var firstDrawerId = firstCard ? firstCard.drawerId : null;
                var firstDrawerObj = firstDrawerId
                  ? allBahasaDrawers.filter(function(d) { return d.id === firstDrawerId; })[0]
                  : null;
                if (firstDrawerObj) {
                  var blockIssuesSR = checkTipsBlock(firstDrawerObj);
                  if (blockIssuesSR.length) {
                    renderBlockCard(firstDrawerObj.title || '', blockIssuesSR);
                    return;
                  }
                }
              }
              renderCard();
            }
          });

        } else {
          // ── SELEPAS LACI BIASA: check SR dulu sebelum ke laci seterusnya ──
          loadSROverdue(srCol).then(function(overdue) {
            srQueue = overdue || [];
            _srAdaCache = srQueue.length > 0;

            if (srQueue.length) {
              // Ada SR — load SATU SR, prefetch laci biasa seterusnya
              srLaciSemasa = srQueue.shift();
              srModeAktif = true;
              // Prefetch laci biasa yang akan datang selepas SR ini
              if (mode === 'bahasa') _prefetchLaciBiasaBahasa();
              else _prefetchLaciBiasaFakta();

              loadSRIntoCards(srLaciSemasa, mode, function(ok) {
                if (ok) {
                  var srStatusLabel = (mode === 'bahasa' ? 'SR BAHASA' : 'SR FAKTA') + ' · ' + getLabelFasaSR(srLaciSemasa.fasaSemasa || 0);
                  setText('play-status', srStatusLabel);
                  isFlipped = false; showTips = false; isBusy = false;
                  setText('play-err', '');
                  // Block check untuk SR bahasa
                  if (mode === 'bahasa') {
                    var srNextDrawer = allBahasaDrawers.filter(function(d) { return d.id === srLaciSemasa.drawerId; })[0];
                    if (srNextDrawer) {
                      var srNextIssues = checkTipsBlock(srNextDrawer);
                      if (srNextIssues.length) {
                        renderBlockCard(srNextDrawer.title || '', srNextIssues);
                        return;
                      }
                    }
                  }
                  clearBlockCard();
                  if (mode === 'bahasa' && jqAktif && jqMotivasiList.length) {
                    tunjukMotivasiJQ(function() {
                      setText('play-status', srStatusLabel);
                      renderCard();
                    });
                  } else {
                    renderCard();
                  }
                  return;
                }
                // SR drawer tiada — reset dan terus ke laci biasa seterusnya
                srModeAktif = false; srLaciSemasa = null; _srAdaCache = false;
                _terusLaciSeterusnya();
              });
              return;
            }

            // Tiada SR — terus ke laci biasa seterusnya
            _terusLaciSeterusnya();

          }).catch(function(e) {
            isBusy = false; setText('play-err', e.message || 'Gagal check SR');
          });

          function _terusLaciSeterusnya() {
            if (isLast && mode === 'bahasa') {
              lompatPerkataanSeterusnya().then(function(ok) {
                isBusy = false; setText('play-err', '');
                if (!ok) {
                  setText('main-text', 'Habis semua perkataan dalam jenis kata ini.');
                  setText('side-label', ''); setCardImage('');
                }
              });
              return;
            }
            if (isLast && mode === 'fakta') {
              cardIndex = 0; syncIndex(0); isBusy = false; setText('play-err', '');
              setText('main-text', 'Habis semua laci topik ini. (Kitar semula dari awal)');
              setText('side-label', ''); setCardImage('');
              return;
            }
            // Block check bahasa untuk laci seterusnya
            if (mode === 'bahasa') {
              var nextCard0 = cards[nextIdx];
              var nextDrawerId = nextCard0 ? nextCard0.drawerId : null;
              var nextDrawerObj = nextDrawerId
                ? allBahasaDrawers.filter(function(d) { return d.id === nextDrawerId; })[0]
                : null;
              if (nextDrawerObj) {
                var blockIssues = checkTipsBlock(nextDrawerObj);
                if (blockIssues.length) {
                  cardIndex = nextIdx; syncIndex(cardIndex);
                  isFlipped = false; showTips = false; isBusy = false;
                  setText('play-status', 'BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''));
                  renderBlockCard(nextDrawerObj.title || '', blockIssues);
                  return;
                }
              }
            }
            cardIndex = nextIdx; syncIndex(cardIndex);
            isFlipped = false; showTips = false; isBusy = false;
            clearBlockCard();
            setText('play-err', '');
            if (jqAktif && jqMotivasiList.length) {
              tunjukMotivasiJQ(function() {
                setText('play-status', mode === 'bahasa'
                  ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
                  : ('FAKTA · ' + ((activeTopic && activeTopic.name) || '')));
                renderCard();
              });
              return;
            }
            setText('play-status', mode === 'bahasa'
              ? ('BAHASA · ' + ((activePerkataan && activePerkataan.name) || ''))
              : ('FAKTA · ' + ((activeTopic && activeTopic.name) || '')));
            renderCard();
          }
        }
      }).catch(function(e) {
        isBusy = false; setText('play-err', e.message || 'Gagal simpan');
      });
    }

    function nextCard() {
      if (isBusy) return;

      // Mode motivasi JQ — tekan SETERUSNYA → ikut cara app pertama
      if (window._jqMotivasiHandler) {
        var h = window._jqMotivasiHandler;
        if (h.adaFlip && !h.flipped) {
          // Tap pertama — tunjuk belakang
          h.flipped = true;
          setText('side-label', 'MUKA BELAKANG');
          setText('main-text', h.belakang);
          setText('play-progress', '(Tekan SETERUSNYA untuk teruskan)');
          var mainElM = document.getElementById('main-text');
          if (mainElM) mainElM.className = h.belakang.length > 80 ? 'big-text long-text' : 'big-text';
          document.getElementById('btn-flip').className = 'btn-sm on';
          return;
        }
        // Tap terakhir — selesai motivasi, sambung
        var cbM = h.cb;

        // Supplement atau Water — tunjuk overlay confirm dulu
        if ((h.source === 'supplement' || h.source === 'water') && currentUser) {
          var hSnap = h; // simpan rujukan
          champShowConfirm(hSnap,
            // Ya — rekod + commit index
            function() {
              if (hSnap.source === 'water' && hSnap.waterItem) {
                var wi = hSnap.waterItem;
                var todayKey = (function() {
                  var d = new Date();
                  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                })();
                var mlMinum = (wi.kindleMl && wi.kindleMl >= 50) ? wi.kindleMl : 100;
                var newMinum = (wi.minum || 0) + mlMinum;
                db.collection('users').doc(currentUser.uid).collection('water_tracker').doc(todayKey)
                  .set({ minum: newMinum, log: [{ ml: mlMinum, ts: Date.now(), src: 'kindle' }], dateKey: todayKey, updatedAt: Date.now() }, { merge: true })
                  .catch(function() {});
                var goal = wi.goal || 2000;
                var baki = Math.max(0, goal - newMinum);
                var pct = Math.min(100, Math.round(newMinum / goal * 100));
                db.collection('users').doc(currentUser.uid).collection('water_tracker').doc('champion_item')
                  .set({
                    title: '💧 Air: ' + newMinum + 'ml / ' + goal + 'ml (' + pct + '%)',
                    text: baki > 0 ? 'Baki ' + baki + 'ml lagi untuk capai goal hari ini.' : '✅ Goal air hari ini dah tercapai!',
                    minum: newMinum, goal: goal, baki: baki, pct: pct, updatedAt: Date.now()
                  }, { merge: true }).catch(function() {});
              }
              // Commit index — baru naikkan selepas user sahkan
              if (hSnap.champSourceKey) champCommitItem(hSnap.champSourceKey, hSnap.champActiveLen);
              _selesaiMotivasi();
              if (cbM) cbM();
            },
            // Skip — TIDAK commit index, item yang sama akan muncul semula
            function() {
              // Index tidak dinaikkan — item kekal untuk kitaran seterusnya
              // Tiada perlu revert kerana commit belum berlaku
              _selesaiMotivasi();
              if (cbM) cbM();
            }
          );
          return;
        }

        // Motivasi / Perjanjian / Rutin — commit index terus (tiada confirm)
        if (h.champSourceKey) champCommitItem(h.champSourceKey, h.champActiveLen);
        _selesaiMotivasi();
        if (cbM) cbM();
        return;
      }

      if (!cards.length || cardIndex >= cards.length) return;
      var c = cards[cardIndex];
      if (c.isTamat) { afterTamat(c); return; }

      // Fasa Gambar — terus ke kad seterusnya sahaja
      if (c.isGambar) {
        isFlipped = false; showTips = false;
        // Prefetch: kad Gambar G1 ke-5 (index r=4, iaitu kad Gambar ke-5 dalam blok 10)
        // Kira berapa kad Gambar dalam blok semasa
        if (c.gambarSlot === 1) {
          var gCount = 0;
          for (var gi = cardIndex; gi >= 0 && cards[gi] && cards[gi].isGambar && cards[gi].drawerId === c.drawerId; gi--) gCount++;
          if (gCount === 5) {
            // Ini kad G1 ke-5 — masa terbaik prefetch
            if (srModeAktif) {
              // Dalam SR → prefetch laci BIASA (sebab selepas SR wajib laci biasa)
              if (mode === 'bahasa') _prefetchLaciBiasaBahasa();
              else _prefetchLaciBiasaFakta();
            } else {
              // Dalam laci biasa → prefetch ikut ada SR atau tidak (_srAdaCache)
              if (_srAdaCache) {
                // Ada SR akan datang → prefetch SR seterusnya dari srQueue
                if (srQueue.length) prefetchDrawer(srQueue[0].drawerId, mode === 'bahasa' ? 'bahasa_drawers' : 'drawer');
              } else {
                // Tiada SR → prefetch laci biasa seterusnya
                var nextLaciId = null;
                for (var ni = cardIndex + 1; ni < cards.length; ni++) {
                  if (cards[ni].drawerId && cards[ni].drawerId !== c.drawerId) { nextLaciId = cards[ni].drawerId; break; }
                }
                if (nextLaciId) prefetchDrawer(nextLaciId, mode === 'bahasa' ? 'bahasa_drawers' : 'drawer');
              }
            }
          }
        }
        cardIndex++;
        if (cardIndex < cards.length) { syncIndex(cardIndex); renderCard(); }
        else renderCard();
        return;
      }

      // Fakta F1 habis (isEndF1) → tunjuk motivasi JQ, kemudian sambung ke F2
      if (mode === 'fakta' && c.isEndF1) {
        isFlipped = false; showTips = false;
        // Prefetch ikut konteks semasa
        if (srModeAktif) {
          // Dalam SR → prefetch laci BIASA (sebab selepas SR wajib laci biasa)
          _prefetchLaciBiasaFakta();
        }
        // Dalam laci biasa isEndF1 — tiada prefetch (G1 ke-5 dah buat)
        cardIndex++;
        syncIndex(cardIndex);
        if (jqAktif && jqMotivasiList.length) {
          var f2Index = cardIndex;
          tunjukMotivasiJQ(function() {
            cardIndex = f2Index;
            var statusLabel = srModeAktif
              ? ('SR FAKTA · ' + getLabelFasaSR((srLaciSemasa && srLaciSemasa.fasaSemasa) || 0))
              : ('FAKTA · ' + ((activeTopic && activeTopic.name) || ''));
            setText('play-status', statusLabel);
            renderCard();
          });
        } else {
          renderCard();
        }
        return;
      }

      // Fakta F2 habis (isLastOfBaris) → daftar SR untuk baris ini
      if (mode === 'fakta' && !srModeAktif && c.isLastOfBaris && c.drawerId != null && c.itemIndex != null) {
        isBusy = true;
        setText('play-err', 'Daftar SR baris...');
        daftarSRBaru(c.drawerId, 'fakta', c.itemIndex, c.front).then(function() {
          isBusy = false;
          setText('play-err', '');
          isFlipped = false; showTips = false;
          cardIndex++;
          if (cardIndex < cards.length) { syncIndex(cardIndex); renderCard(); }
          else renderCard();
        }).catch(function(e) {
          isBusy = false;
          setText('play-err', e.message || 'Gagal SR');
        });
        return;
      }

      // Reset flip hanya bila tukar fasa, kekal flip dalam fasa yang sama
      var fasaSebelum = c.isF0 ? 0 : (c.fasa !== undefined ? c.fasa : -1);
      var nextC = cards[cardIndex + 1];
      var fasaSelepas = nextC ? (nextC.isF0 ? 0 : (nextC.fasa !== undefined ? nextC.fasa : -1)) : -1;
      if (fasaSelepas !== fasaSebelum) { isFlipped = false; showTips = false; }

      cardIndex++;
      if (cardIndex < cards.length) { syncIndex(cardIndex); renderCard(); }
      else renderCard();
    }

    // ══════════════════════════════════════════

    var gtAllTajuk = [];
    var gtActiveTajuk = null;
    var _gtUnsub = null;

    function gtSubscribe() {
      if (!currentUser) return;
      if (_gtUnsub) _gtUnsub();
      _gtUnsub = db.collection('users').doc(currentUser.uid)
        .collection('go_tick_tajuk')
        .onSnapshot(function(snap) {
          gtAllTajuk = [];
          snap.forEach(function(d) { var x = d.data(); x.id = d.id; gtAllTajuk.push(x); });
          gtAllTajuk.sort(function(a, b) {
            if (a.isEmergency && !b.isEmergency) return -1;
            if (!a.isEmergency && b.isEmergency) return 1;
            return (a.order || 0) - (b.order || 0);
          });
          // Update active tajuk kalau sedang dalam checklist
          if (gtActiveTajuk) {
            var updated = gtAllTajuk.filter(function(t) { return t.id === gtActiveTajuk.id; })[0];
            if (updated) { gtActiveTajuk = updated; gtRenderChecklist(); }
          }
          gtRenderTajukList();
        }, function(e) { setText('gt-list-err', 'Gagal load: ' + e.message); });
    }

    function gtRenderTajukList() {
      var list = document.getElementById('gt-tajuk-list');
      if (!list) return;
      if (!gtAllTajuk.length) {
        list.innerHTML = '<div class="msg">Tiada destinasi. Tambah dari telefon.</div>';
        return;
      }
      list.innerHTML = '';
      var totalItems = 0, totalTicked = 0;
      gtAllTajuk.forEach(function(t) {
        (t.items || []).forEach(function(it) { totalItems++; if (it.ticked) totalTicked++; });
      });
      setText('gt-list-status', 'Go-Tick · ' + totalTicked + '/' + totalItems);

      gtAllTajuk.forEach(function(t) {
        var items = t.items || [];
        var ticked = items.filter(function(it) { return it.ticked; }).length;
        var allDone = items.length > 0 && ticked === items.length;
        var btn = document.createElement('button');
        btn.className = 'gt-tajuk-item' + (t.isEmergency ? ' emergency' : '');
        var badge = t.isEmergency ? ' 🚨' : '';
        var prog = ' (' + ticked + '/' + items.length + (allDone ? ' ✓' : '') + ')';
        btn.textContent = (t.title || 'Tanpa Tajuk') + badge + prog;
        btn.onclick = function() { gtOpenDestinasi(t); };
        list.appendChild(btn);
      });
    }

    function gtOpenDestinasi(t) {
      gtActiveTajuk = t;
      var items = t.items || [];
      var ticked = items.filter(function(it) { return it.ticked; }).length;
      setText('gt-check-status', (t.isEmergency ? '🚨 ' : '') + (t.title || '') + ' · ' + ticked + '/' + items.length);
      gtRenderChecklist();
      showScreen('screen-gotick-check');
    }

    function gtRenderChecklist() {
      var el = document.getElementById('gt-checklist');
      if (!el || !gtActiveTajuk) return;
      var items = gtActiveTajuk.items || [];

      if (!items.length) {
        el.innerHTML = '<div class="msg">Tiada item. Tambah dari telefon.</div>';
        return;
      }
      el.innerHTML = '';

      // Kumpulkan ikut group
      var groups = [];
      var groupMap = {};
      items.forEach(function(it, idx) {
        var g = it.group || '';
        if (!groupMap.hasOwnProperty(g)) {
          groupMap[g] = groups.length;
          groups.push({ name: g, items: [], isEmergency: !!it.isEmergency });
        }
        groups[groupMap[g]].items.push({ item: it, idx: idx });
      });

      // Kumpulan kecemasan naik ke atas
      groups.sort(function(a, b) {
        if (a.isEmergency && !b.isEmergency) return -1;
        if (!a.isEmergency && b.isEmergency) return 1;
        return 0;
      });

      groups.forEach(function(grp) {
        if (grp.name) {
          var gl = document.createElement('div');
          gl.className = 'gt-group-label';
          gl.style.cssText = grp.isEmergency ? 'color:#800;border-bottom-color:#800;' : '';
          gl.textContent = (grp.isEmergency ? '🚨 ' : '') + grp.name;
          el.appendChild(gl);
        }
        grp.items.forEach(function(entry) {
          var it = entry.item;
          var idx = entry.idx;
          var row = document.createElement('div');
          row.className = 'gt-item-row';
          var cb = document.createElement('div');
          cb.className = 'gt-checkbox' + (it.ticked ? ' ticked' : '');
          cb.textContent = it.ticked ? '✓' : '';
          var nm = document.createElement('div');
          nm.className = 'gt-item-name' + (it.ticked ? ' ticked' : '');
          nm.textContent = it.name || '';
          row.appendChild(cb);
          row.appendChild(nm);
          row.onclick = function() { gtToggleItem(idx); };
          el.appendChild(row);
        });
      });

      // Update status
      var ticked = items.filter(function(it) { return it.ticked; }).length;
      setText('gt-check-status', (gtActiveTajuk.isEmergency ? '🚨 ' : '') + (gtActiveTajuk.title || '') + ' · ' + ticked + '/' + items.length + (ticked === items.length && items.length > 0 ? ' ✓' : ''));
    }

    function gtToggleItem(idx) {
      if (!gtActiveTajuk || !currentUser) return;
      var items = (gtActiveTajuk.items || []).slice();
      if (idx < 0 || idx >= items.length) return;
      items[idx] = { group: items[idx].group || '', name: items[idx].name || '', ticked: !items[idx].ticked };
      gtActiveTajuk.items = items;
      db.collection('users').doc(currentUser.uid).collection('go_tick_tajuk').doc(gtActiveTajuk.id)
        .update({ items: items, updatedAt: Date.now() })
        .catch(function(e) { setText('gt-check-err', 'Gagal simpan: ' + e.message); });
      gtRenderChecklist();
    }

    function gtUntickSemua() {
      if (!gtActiveTajuk || !currentUser) return;
      if (!confirm('Untick semua item dalam "' + (gtActiveTajuk.title || '') + '"?')) return;
      var items = (gtActiveTajuk.items || []).map(function(it) {
        return { group: it.group || '', name: it.name || '', ticked: false };
      });
      gtActiveTajuk.items = items;
      db.collection('users').doc(currentUser.uid).collection('go_tick_tajuk').doc(gtActiveTajuk.id)
        .update({ items: items, updatedAt: Date.now() })
        .catch(function(e) { setText('gt-check-err', 'Gagal simpan: ' + e.message); });
      gtRenderChecklist();
    }

    document.getElementById('btn-go-gotick').onclick = function() {
      gtSubscribe();
      showScreen('screen-gotick-list');
    };
    document.getElementById('btn-gt-back-menu').onclick = function() {
      if (_gtUnsub) { _gtUnsub(); _gtUnsub = null; }
      showScreen('screen-menu');
    };
    document.getElementById('btn-gt-back-list').onclick = function() {
      gtRenderTajukList();
      showScreen('screen-gotick-list');
    };
    document.getElementById('btn-gt-untick-all-global').onclick = gtUntickSemua;
    // ══════════════════════════════════════════

    auth.onAuthStateChanged(function(user) {    
      document.body.classList.remove('auth-checking');
      currentUser = user;
      document.getElementById('btn-login').disabled = false;
      if (user) {
        setText('menu-user', 'Linked · Login OK');
        loadJQStatus();
        subscribeJoggingMotivasi();
        subscribeChampion();
        showScreen('screen-menu');
      } else {
        if (_jqMotivasiUnsubscribe) { _jqMotivasiUnsubscribe(); _jqMotivasiUnsubscribe = null; }
        _champUnsubs.forEach(function(u) { try { u(); } catch(e) {} }); _champUnsubs = [];
        champSources = []; champLastIdx = 0;
        champData = { motivasi: [], perjanjian: [], rutin: [], supplement: [], water: [] };
        window._jqMotivasiHandler = null;
        jqAktif = false;
        jqMotivasiList = [];
        jqPendingCardIndex = -1;
        updateJQButton();
        showScreen('screen-login');
        setText('login-msg', '');
      }
    });
  </script>
  <!-- CHAMPION CONFIRM OVERLAY -->
  <div class="champ-overlay" id="champ-overlay">
    <div class="champ-overlay-box">
      <div class="champ-overlay-title" id="champ-overlay-title">—</div>
      <div class="champ-overlay-name" id="champ-overlay-name">—</div>
      <button class="champ-overlay-btn-yes" id="champ-overlay-yes">✓ Ya, rekod</button>
      <div class="champ-overlay-q" id="champ-overlay-q" style="margin:0;padding:8px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;">Sudah diambil / dilaksanakan?</div>
      <button class="champ-overlay-btn-skip" id="champ-overlay-skip">⏭ Terlalu awal — ambil pada kitaran seterusnya</button>
    </div>
  </div>
</body>
